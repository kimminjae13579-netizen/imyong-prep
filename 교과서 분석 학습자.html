<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교과서 분석</title>
<script src="교과서분석_데이터.js"></script>
<script src="교과서PDF/목록.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --ink:#1d2433; --sub:#5d6678; --line:#e1e4eb;
  --accent:#3b5bdb; --accent-soft:#e8edff; --star:#f5a524; --warn:#e03131; --warn-soft:#fff0f0;
  --ok:#2b8a3e; --ok-soft:#ebfbee; --memo:#fff8e1; --memo-line:#f1d27a; --pdfbg:#d9dce3;
  --shadow:0 1px 3px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- 버튼 ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--ink);white-space:nowrap}
.btn:hover{background:#f1f3f8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--warn)}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:none;background:none;color:var(--sub);padding:2px 6px;border-radius:6px}
.iconbtn:hover{background:#eef0f5;color:var(--ink)}

/* ---------- 서재 ---------- */
#library{max-width:900px;margin:0 auto;padding:48px 20px}
#library h1{font-size:28px;margin:0 0 6px}
#library .lead{color:var(--sub);margin:0 0 28px}
.drop{border:2px dashed #b9c2d6;border-radius:14px;padding:36px;text-align:center;background:#fff;color:var(--sub);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:24px}
.book{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:16px;cursor:pointer;border:1px solid transparent}
.book:hover{border-color:var(--accent)}
.book .nm{font-weight:700;margin-bottom:6px;word-break:keep-all}
.book .meta{color:var(--sub);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.book.remote{border:1px dashed #9db4e0;background:#f6f9ff}
.syncbar{margin-top:16px;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;color:var(--sub);font-size:14px;line-height:1.6;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.syncbar:empty{display:none}
.syncbar .grow{flex:1;min-width:220px}
.syncbar b{color:var(--ink)}
.syncbar .ok{color:#1a7f37;font-weight:600}
.syncbar .warn{color:#b35900;font-weight:600}
/* 드라이브에서 받는 중 로딩바 */
.dlbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;width:min(440px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px 12px;box-shadow:0 14px 36px rgba(0,0,0,.3);border-left:6px solid var(--star)}
.dlbar .dlt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dlbar .dlt b{font-size:15.5px}
.dlbar .dlt span{font-size:14px;color:rgba(255,255,255,.75)}
.dlbar .dltrack{margin-top:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.dlbar .dltrack i{display:block;height:100%;width:0;border-radius:999px;background:var(--star);transition:width .2s}
.dlbar .dlnum{display:flex;justify-content:space-between;margin-top:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.dlbar .dlnum .pc{font-weight:700;color:var(--star)}
.dlbar p{margin:4px 0 0;font-size:12.5px;color:rgba(255,255,255,.6)}
/* 구글 드라이브 (임용 준비와 같은 연결) */
.gdlib{margin:0 0 16px;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;line-height:1.6}
.gdlib .gdst{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--sub)}
.gdlib .gdst::before{content:"";width:9px;height:9px;border-radius:50%;background:#AEB4C0;flex:none}
.gdlib.ok .gdst{color:var(--ok)} .gdlib.ok .gdst::before{background:var(--ok)}
.gdlib.sync .gdst::before{background:var(--star);animation:gdp .8s infinite alternate}
.gdlib.need .gdst{color:#b35900} .gdlib.need .gdst::before{background:var(--star)}
.gdlib.err .gdst{color:var(--warn)} .gdlib.err .gdst::before{background:var(--warn)}
.gdlib .gdhint{color:var(--sub);flex:1;min-width:220px}
.gdlib .btn{margin-left:auto}
@keyframes gdp{to{opacity:.3}}
/* 폴더 끌어다 놓기 */
.dropin{margin:0 0 16px;border:2px dashed #9db4e0;background:#f6f9ff;border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.dropin .dt{flex:1;min-width:240px;display:grid;gap:3px;line-height:1.6}
.dropin .dt b{font-size:15.5px;color:var(--ink)}
.dropin .dt span{font-size:13.5px;color:var(--sub)}
#library{position:relative}
#library.dragging::after{content:"여기에 놓으세요";position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:16px;background:rgba(232,237,255,.85);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--accent);z-index:50;pointer-events:none}
#syncBtn.ok{color:#1a7f37}
#syncBtn.warn{color:#b35900}

/* ---------- 작업 화면 ---------- */
#work{display:flex;flex-direction:column;height:100vh}
header.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top .title{font-weight:800;font-size:15px;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;color:var(--sub)}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.pageinfo{display:flex;align-items:center;gap:4px;color:var(--sub)}
.pageinfo input{width:56px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px}
.main{flex:1;display:grid;grid-template-columns:270px 1fr 420px;min-height:0}

/* 왼쪽 목차 */
aside.toc{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.toc .tools{padding:10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.toc .list{overflow:auto;flex:1;padding:6px 6px 30px}
.unit{font-size:12px;font-weight:700;color:var(--sub);padding:12px 8px 4px}
.su{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}
.su:hover{background:#f3f5fa}
.su.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.su.here .t::after{content:" ◀";color:var(--accent);font-size:10px}
.su .t{flex:1;min-width:0;line-height:1.35;word-break:keep-all}
.su .pg{color:var(--sub);font-size:11px}
.minstars{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:#9a6700;background:#fff4d6;border-radius:999px;padding:1px 8px;white-space:nowrap}
.empty{color:var(--sub);text-align:center;padding:30px 14px;line-height:1.7}

/* 가운데 PDF */
#viewer{overflow:auto;background:var(--pdfbg);position:relative}
#pages{padding:20px 0 60px;display:flex;flex-direction:column;align-items:center;align-items:safe center;gap:16px}
.prow{display:flex;gap:10px;align-items:flex-start}
.rail{width:170px;flex:none;display:flex;flex-direction:column;gap:8px;align-items:flex-end;padding-top:6px}
.pagebox{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pagebox canvas{display:block}
.pagebox .pno{position:absolute;bottom:-18px;right:0;font-size:11px;color:#555}
.tag{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:7px 10px;width:100%;cursor:pointer;border:2px solid transparent;position:relative}
.tag::after{content:"";position:absolute;right:-12px;top:12px;border:6px solid transparent;border-left-color:#fff}
.tag.sel{border-color:var(--accent)}
.tag .tt{font-weight:700;font-size:12.5px;line-height:1.35;word-break:keep-all}
.tag .st{color:var(--star);font-size:13px;letter-spacing:-1px}
.tag .ic{font-size:11px;color:var(--sub);margin-top:2px}
.addhere{opacity:0;transition:.15s;font-size:12px;border:1px dashed #8994ad;background:rgba(255,255,255,.7);border-radius:8px;padding:4px 8px;color:#45506a}
.prow:hover .addhere{opacity:1}
body.learn .addhere{display:none}
.rail{display:none}

/* 오른쪽 패널 */
aside.panel{background:#fff;border-left:1px solid var(--line);overflow:auto;min-height:0}
.phead{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.phead .unitname{font-size:12px;color:var(--sub)}
.phead h2{margin:2px 0 0;font-size:18px;word-break:keep-all}
.phead .row{display:flex;gap:6px;margin-top:8px;align-items:center}
.phead input.ti{flex:1;font-size:16px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.phead input.un{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.phead input.pg{width:64px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.sec{padding:16px 18px;border-bottom:8px solid var(--bg)}
.sec h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px}
.sec h3 .sp{flex:1}
.stars{display:flex;gap:2px;align-items:center}
.stars button{border:none;background:none;font-size:30px;line-height:1;color:#d6d9e0;padding:0 1px}
.stars button.on{color:var(--star)}
body.edit .stars button:hover{transform:scale(1.12)}
.stars .lbl{margin-left:10px;color:var(--sub);font-size:13px}
textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;line-height:1.55;background:#fff}
textarea:focus,input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.mc{border:1px solid #f3c4c4;background:var(--warn-soft);border-radius:10px;padding:10px;margin-bottom:10px}
.mc .lab{font-size:12px;font-weight:700;margin:2px 0 4px}
.mc .lab.x{color:var(--warn)}
.mc .lab.o{color:var(--ok)}
.mc .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px;color:var(--sub)}
.mc .view{white-space:pre-wrap;line-height:1.6}
.mc .right{background:var(--ok-soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.memo{background:var(--memo);border:1px solid var(--memo-line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;line-height:1.7}
.memo textarea{background:transparent;border:none;padding:0;min-height:120px}
.memo textarea:focus{outline:none}
.task{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:#fbfcfe}
.task .q{font-weight:700;white-space:pre-wrap;line-height:1.6;margin-bottom:8px}
.task .lab{font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px;display:flex;align-items:center;gap:6px}
.task .lab .sp{flex:1}
.rub{display:grid;grid-template-columns:22px 1fr 30px;gap:6px;align-items:start;margin-bottom:6px}
.rub .no{color:var(--sub);padding-top:8px;text-align:center;font-size:12px}
.rub input.pt{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:right}
.kwrow{grid-column:2 / 5;display:flex;flex-direction:column;gap:5px;background:#f1f4fb;border-radius:8px;padding:7px 8px;margin-top:-2px}
.kwrow .kl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.kwrow .kl b{white-space:nowrap;width:62px;flex:none}
.kwrow input.kw{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12.5px;background:#fff}
.kwrow select,.kwrow input.need{border:1px solid var(--line);border-radius:6px;padding:4px 5px;font-size:12px;background:#fff}
.kwrow input.need{width:46px;text-align:center}
.total{font-size:12px;color:var(--sub);text-align:right}
.result.kwr{border-color:#b7e1c1;background:var(--ok-soft)}
.result.kwr .score{color:var(--ok)}
.result.kwr .bar i{background:var(--ok)}
.result .rt{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid}
.chip.y{color:var(--ok);border-color:#9fd8ab;background:#fff}
.chip.n{color:#8a93a6;border-color:#d5d9e2;background:#fff;text-decoration:line-through}
.chip.x{color:var(--warn);border-color:#f3b4b4;background:#fff}
.result{margin-top:12px;border-radius:10px;border:1px solid #c5d3ff;background:var(--accent-soft);padding:12px}
.result .score{font-size:22px;font-weight:800;color:var(--accent)}
.result .score small{font-size:13px;color:var(--sub);font-weight:500}
.crit{background:#fff;border-radius:8px;padding:8px 10px;margin-top:8px}
.crit .ch{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px}
.crit .ch .s{white-space:nowrap}
.crit .cr{color:var(--sub);margin-top:4px;line-height:1.55;white-space:pre-wrap}
.bar{height:6px;border-radius:3px;background:#e3e7f0;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.fb{margin-top:10px;line-height:1.65;white-space:pre-wrap}
.when{font-size:11px;color:var(--sub);margin-top:8px}
.note{font-size:12px;color:var(--sub);line-height:1.6}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.modal .mb{padding:16px 20px;overflow:auto;line-height:1.6}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal label.f{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.modal select,.modal input[type=password],.modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px}
.olitem{display:flex;gap:8px;align-items:center;padding:3px 0}
.olitem .p{color:var(--sub);font-size:12px;margin-left:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;box-shadow:var(--shadow)}

#work{height:100dvh}

/* ---------- 끌어다 놓기 도구 / 핀 ---------- */
.viewwrap{position:relative;display:flex;min-height:0;min-width:0}
.viewwrap #viewer{flex:1;min-width:0}
#palette{position:absolute;right:16px;top:14px;z-index:6;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(20,30,60,.22);padding:8px;display:flex;flex-direction:column;gap:6px;width:82px}
#palette .ph{font-size:11px;color:var(--sub);text-align:center;line-height:1.3;font-weight:700}
.tool{touch-action:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px 6px;font-size:24px;line-height:1;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool span{font-size:11px;color:var(--ink);margin-top:4px;font-weight:700;letter-spacing:-.3px}
.ghost{position:fixed;pointer-events:none;z-index:100;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--accent);border-radius:12px;padding:6px 10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px;display:flex;flex-direction:column;align-items:center;max-width:220px}
.ghost span{font-size:11px;font-weight:700}
.prow:not([data-r]) .pagebox::before{content:"쪽을 불러오는 중…";position:absolute;left:0;right:0;top:40%;text-align:center;color:#9aa3b5;font-size:14px}
.pagebox.drop-target{outline:4px dashed var(--accent);outline-offset:3px}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;pointer-events:auto;transform:translate(-14px,-12px);cursor:pointer;user-select:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:1}
body.edit .pin{touch-action:none;cursor:grab}
.pin:hover{z-index:3;filter:brightness(1.04)}
.pin.sel{outline:3px solid var(--accent);outline-offset:2px;z-index:2}
.pin.dragging,.item.dragging{opacity:.4}
.pin.mark{background:#fff7db;border:2px solid var(--star);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700}
.pin.mark .st{color:var(--star);letter-spacing:-1px}
.pin.mc{background:#fff;border:2px solid var(--warn);color:var(--warn);border-radius:999px;padding:2px 9px;font-weight:700;font-size:12.5px}
.pin.task{background:var(--accent);color:#fff;border-radius:999px;padding:4px 11px;font-weight:700;font-size:13px}
.pin.memo{background:#fff3b0;border:2px solid #d4a72c;color:#6b5200;border-radius:999px;padding:2px 9px;font-weight:700;font-size:12.5px}
.mloc{font-weight:400;font-size:12px;color:var(--sub);margin-left:6px}
.mclab{font-size:13px;font-weight:700;margin:6px 0 4px}
.mclab.x{color:var(--warn)} .mclab.o{color:var(--ok);margin-top:12px}
.modal .stars button{font-size:36px}
.btn.danger{color:var(--warn)}

/* 오른쪽 목록 카드 */
.item{display:flex;gap:6px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff}
.item:hover{border-color:var(--accent)}
.item.sel{border-color:var(--accent);background:var(--accent-soft)}
.item .handle{cursor:grab;color:#9aa3b5;font-size:16px;padding:0 2px;touch-action:none;user-select:none}
.item .bd{flex:1;min-width:0}
.item .tx{line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.item .tx .st{color:var(--star)}
.item .loc{font-size:11px;color:var(--sub);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{background:#eef1f7;border-radius:999px;padding:1px 8px;font-size:11px;color:var(--sub)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.sec h3 small{color:var(--sub);font-weight:500}

/* 전체 화면 (문제 편집 / 풀이) */
.fs{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
.fs .fh{display:flex;align-items:center;gap:8px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fs .fh .t{font-weight:800;font-size:16px;flex:1;min-width:0}
.fs .fbody{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}

.card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}

/* ---------- 태블릿 (세로 화면 / 좁은 화면): 한 번에 한 화면 ---------- */

  .prow{flex-direction:column;gap:6px;align-items:stretch}
  .rail{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:0}
  .rail:empty{display:none}
  .tag{width:auto;max-width:100%}

  #pages{padding:12px 8px 60px}
  .phead{padding:14px 16px 10px}
  .sec{padding:16px}
}
/* 터치 기기: 손가락으로 누르기 쉽게 */

  .seg button{min-height:40px}
  .su{padding:12px 10px}
  .stars button{font-size:36px;padding:0 3px}
  textarea,input,select{font-size:16px!important}
  .addhere{opacity:1}
  .tag{padding:9px 12px}
}

/* ---------- 큰 버튼 ---------- */
body{font-size:15px}
.btn{font-size:15px;padding:10px 18px;border-radius:10px;min-height:44px}
.btn.small{font-size:14px;padding:7px 14px;min-height:38px}
.iconbtn{font-size:20px;min-width:40px;min-height:40px}
.seg button{font-size:15px;padding:10px 18px;min-height:44px}
header.top{gap:10px;padding:10px 16px}
header.top .title{font-size:17px}
.pageinfo{font-size:15px}
.pageinfo input{width:64px;padding:8px;font-size:15px}
.stars button{font-size:40px;padding:0 3px}

#palette{width:132px;padding:12px;gap:10px;border-radius:18px;top:16px;right:18px}

.pin.task{font-size:17px;padding:7px 16px}

.su{padding:11px 10px;font-size:15px}
.item{padding:12px 12px}
.item .handle{font-size:22px}
.sec h3{font-size:17px}
.fs .fh{padding:12px 20px}
.fs .fh .t{font-size:18px}
/* 중요도 1~5 (별 대신 숫자) */
.lvl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lvl .lt{font-weight:800;color:#9a6700;margin-right:4px}
.lvl button{border:none;background:none;padding:0 2px;font-size:40px;line-height:1;color:#d6d9e0}
.lvl button.on{color:var(--star)}
.stc{color:var(--star);letter-spacing:-1px}
.tool .tstar{color:var(--star);font-size:24px;letter-spacing:-2px;line-height:1.2}
.lvl button:disabled{cursor:default}

.lvl .lbl{margin-left:8px;color:var(--sub);font-size:14px}
.lvlbig{display:inline-block;font-size:20px;font-weight:800;color:#9a6700;background:#fff4d6;border-radius:12px;padding:8px 16px}
.pin.mark{color:#9a6700}
.item .tx .st{color:#9a6700}
.tag .st{color:#9a6700;font-size:12px;font-weight:700;letter-spacing:0}
/* 끌고 있는 핀: 모양 그대로 따라다님 */
.pin.floating{position:fixed;z-index:100;pointer-events:none;box-shadow:0 10px 26px rgba(0,0,0,.32)}

/* 수식 입력 */
.mathov{position:fixed;inset:0;z-index:80;background:rgba(15,20,35,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.mathov .mbox{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mathov .mh{padding:14px 20px;border-bottom:1px solid var(--line);font-weight:800;font-size:18px;display:flex;gap:10px;align-items:baseline}
.mathov .mbody{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mathov .mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.mfield{display:block;width:100%;font-size:30px;padding:10px 12px;border:2px solid var(--accent);border-radius:12px;min-height:64px}
.mkeys{display:flex;flex-wrap:wrap;gap:6px}
.mk{min-width:52px;min-height:44px;padding:6px 10px;border:1px solid var(--line);background:#f7f8fb;border-radius:10px;font-size:17px}
.mk:hover{background:var(--accent-soft);border-color:var(--accent)}
.mlab{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px}
.mlatex{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:Consolas,monospace;font-size:15px}
.mprev2{min-height:56px;border:1px dashed #c9d0de;border-radius:10px;padding:12px;font-size:24px;text-align:center;overflow-x:auto}
.mprev{margin-top:6px;padding:8px 12px;border-radius:8px;background:#f4f7ff;border:1px dashed #c5d3ff;white-space:pre-wrap;line-height:1.7;font-size:15px}
.mprev::before{content:"미리보기";display:block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.rich{white-space:pre-wrap;overflow-wrap:anywhere;outline:none;cursor:text;display:block}
.rich:focus{box-shadow:0 0 0 2px var(--accent-soft);border-color:var(--accent)!important}
.rich.empty::before{content:attr(data-ph);color:#9aa3b5;pointer-events:none}
.mchip{display:inline-block;padding:0 3px;margin:0 1px;border-radius:5px;cursor:pointer;line-height:1.2}
.mchip:hover{background:var(--accent-soft);outline:1px solid #c5d3ff}
.mhwp{font-family:Consolas,'D2Coding',monospace;font-size:17px;border:2px solid var(--accent)!important}
.mhelp{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub)}
.mhelp code{background:#eef1f7;border-radius:4px;padding:1px 5px;color:#333;font-size:13px}
.mathov .mprev2{min-height:84px;font-size:28px;display:flex;align-items:center;justify-content:center}
/* 그림 */
.tpic{display:block;max-width:100%;max-height:340px;margin:8px 0;border-radius:6px;background:#fff}
.mimg{display:inline-block;vertical-align:top;margin:4px 2px;border:2px solid transparent;border-radius:8px;cursor:pointer}
.mimg .tpic{max-height:220px;margin:0}
.mimg:hover{border-color:var(--accent)}
.tpic-miss{color:var(--sub);font-size:12px}
.item .tpic,.mnote .tpic{max-height:90px}
.qbig .tpic{max-height:420px}
.pprev{min-height:160px;border:1px dashed #c9d0de;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;background:#fafbfd}
.pprev img{max-width:100%;max-height:44vh}
.pfix{display:flex;gap:8px}
.pfix input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px}
.pdesc{font-size:16px}
.picBtn{margin-right:6px}
/* 표 */
.tblBtn{margin-right:6px}
.ttbl{border-collapse:collapse;margin:6px 0;background:#fff;white-space:normal;font-size:inherit;line-height:1.45}
.ttbl td,.ttbl th{border:1px solid #9aa3b5;padding:5px 10px;text-align:center;vertical-align:middle;min-width:2.5em}
.ttbl th{background:#eef1f7;font-weight:700}
.mtbl{display:inline-block;vertical-align:top;margin:4px 2px;border:2px solid transparent;border-radius:6px;cursor:pointer;max-width:100%;overflow-x:auto}
.mtbl .ttbl{margin:0}
.mtbl:hover{border-color:var(--accent)}
.item .ttbl,.mnote .ttbl{font-size:11px}
.item .ttbl td,.item .ttbl th,.mnote .ttbl td,.mnote .ttbl th{padding:2px 5px}
.tctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px}
.tctl .grp{display:inline-flex;align-items:center;gap:4px}
.tctl .grp b{min-width:1.6em;text-align:center}
.tgrid{overflow:auto;max-height:42vh}
.tgrid table{border-collapse:collapse}
.tgrid td{padding:2px}
.tgrid input{width:120px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:15px}
.tgrid tr.hd input{background:#eef1f7;font-weight:700}
.tprev{border:1px dashed #c9d0de;border-radius:10px;padding:10px;overflow:auto;background:#fafbfd;min-height:50px}
.libio{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:14px}
.libio .grow{flex:1;min-width:220px;color:var(--sub)}
.mathBtn kbd{font-family:inherit;font-size:11px;background:#eef1f7;border-radius:4px;padding:1px 5px;margin-left:4px;color:var(--sub)}
.mbar{display:flex;justify-content:flex-end;margin-bottom:8px}

/* PDF 왼쪽에 붙는 편집 창 (오개념) */
.modal.dock{background:transparent;pointer-events:none;align-items:stretch;justify-content:flex-start;padding:0;bottom:0}
.modal.dock .box{pointer-events:auto;width:400px;max-width:92vw;max-height:none;height:100%;border-radius:0 16px 16px 0;box-shadow:8px 0 28px rgba(20,30,60,.22);border-left:5px solid var(--warn)}
.modal.dock .mb{flex:1}
.modal.dock textarea{font-size:16px}
.modal.dock .box{width:420px}
.modal.dock-memo .box{border-left-color:var(--star)}

/* 왼쪽 창이 열려 있을 때: 목차 자리에 창, 교과서는 그대로 보이게 */
@media (min-width:1024px){
  body.docking .main{grid-template-columns:var(--dockw) 1fr}
  body.docking aside.toc{visibility:hidden}
  body.docking aside.panel{display:none}
}
.fs.dock{inset:auto;left:0;bottom:0;width:var(--dockw);z-index:30;border-left:5px solid var(--accent);box-shadow:8px 0 28px rgba(20,30,60,.22);border-radius:0 16px 0 0;overflow:hidden}
.fs.dock .fh{padding:10px 14px}
.fs.dock .fh .t{font-size:16px}
.fs.dock .fbody{padding:12px}
.fs.dock .card{padding:14px}
.fs.dock textarea.big{min-height:30vh;font-size:17px}
.fs.dock .rub{grid-template-columns:24px 1fr 34px}
@media (max-width:1023px){.fs.dock{width:100%;border-radius:0}}

/* 교과서에서 글 가져오기 */
body.picking .pagebox{cursor:crosshair}
body.picking .pin{pointer-events:none;opacity:.5}
.pickrect{position:absolute;border:2px dashed var(--ok);background:rgba(43,138,62,.12);pointer-events:none;z-index:4}
.flashrect{position:absolute;border:3px solid var(--ok);background:rgba(43,138,62,.18);border-radius:4px;pointer-events:none;z-index:4;animation:flashout 3.2s ease forwards}
@keyframes flashout{0%,75%{opacity:1}100%{opacity:0}}
.pickbar{position:fixed;bottom:24px;left:calc(50% + var(--dockw, 0px) / 2);transform:translateX(-50%);z-index:60;background:#1d2433;color:#fff;padding:10px 12px 10px 18px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:15px;white-space:nowrap}
.pickbar .btn{min-height:34px}
.modal.dock-memo .memo{height:100%;display:flex}
.modal.dock-memo .memo textarea{flex:1;min-height:55vh}
@media (max-width:1280px){#palette{width:112px}.tool{font-size:38px}.tool span{font-size:15px}}

/* ---------- 학습자 보기: 번호 표시 + 여백 노트 ---------- */
.pin.num.mc,.pin.uln.mc,.pin.hlt.mc,.mnote.mc,.sec-mc,.chip.mc{--c:#e03131;--cbg:#fff0f0;--ct:#c92a2a}
.pin.num.memo,.pin.uln.memo,.pin.hlt.memo,.mnote.memo,.sec-memo,.chip.memo{--c:#d4a72c;--cbg:#fff3b0;--ct:#6b5200}
.pin.num.task,.pin.uln.task,.pin.hlt.task,.mnote.task,.sec-task,.chip.task{--c:#3b5bdb;--cbg:#e8edff;--ct:#2b44b0}
.pin.num.mark,.mnote.mark,.sec-mark,.chip.mark{--c:#f5a524;--cbg:#fff7db;--ct:#8a5a00}
.pin.num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;font-size:16px;font-weight:800;border:3px solid var(--c);background:var(--cbg);color:var(--ct);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pin.num.hl,.pin.num.sel{outline:3px solid var(--c);outline-offset:2px;z-index:3}
.margin{display:none}
body.notesOn .margin{display:block;position:relative;width:260px;flex:none}
.mnote{position:absolute;left:0;right:0;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:0 10px 10px 0;padding:9px 12px;font-size:14px;line-height:1.55;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.1);transition:box-shadow .15s}
.mnote:hover,.mnote.hl,.mnote.sel{box-shadow:0 0 0 2px var(--c),0 3px 10px rgba(0,0,0,.15);z-index:2}
.mnote .nh{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--ct);margin-bottom:3px}
.mnote .nno{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:var(--cbg);color:var(--ct);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.mnote .nb{white-space:pre-wrap;color:#333;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.mnote .nb:empty{display:none}
.mnote .wr b{color:#c92a2a;margin-right:3px}
.mnote .rt b{color:var(--ok);margin-right:3px}
.mnote .rt{margin-top:3px}
.mnote .go{color:var(--accent);font-weight:800;margin-top:5px}
.mnote .go.done{color:var(--ok)}
/* 학습자 보기: 여백 노트 맨 위 소단원 요약 */
.mnote.msum{--c:var(--accent);--ct:#2b44b0;cursor:default;border-left-color:var(--accent);background:#f7f9ff}
.mnote.msum .sumt{font-weight:800;font-size:15px;color:#1f2a44}
.mnote.msum .chips{margin-top:6px;gap:5px}
.mnote.msum .chip[data-go]{font-size:12.5px;padding:2px 8px;cursor:default}
.mnote.msum .prog{margin-top:7px}
.mnote.msum:hover{box-shadow:0 1px 5px rgba(0,0,0,.1)}

/* 학습자 패널: 한눈 요약 */
.phead.sum h2{font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip[data-go]{background:var(--cbg);color:var(--ct);border:1px solid var(--c);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip .off{color:#d6d3c8;letter-spacing:-1px}
.prog{height:7px;background:#eef0f4;border-radius:4px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.sec[class*=sec-] h3{color:var(--ct);border-left:5px solid var(--c);padding-left:8px;margin-left:-13px}
body.learn .sec[class*=sec-] .item{border-left:4px solid var(--c)}
/* 화면이 좁으면 여백 노트를 페이지 아래로 */
body.mstack .prow{flex-wrap:wrap;justify-content:center}
body.notesOn.mstack .margin{order:2;height:auto!important;display:flex;flex-direction:column;gap:8px;margin-top:6px}
body.mstack .margin:empty{display:none}
body.mstack .mnote{position:static}
/* 왼쪽 여백 노트: 교과서 쪽을 가리키게 오른쪽에 색 띠 */
.mnote{border-left:1px solid var(--line);border-right:5px solid var(--c);border-radius:10px 0 0 10px}
.mnote.sel,.mnote.hl,.mnote:hover{box-shadow:0 0 0 2px var(--c),0 3px 10px rgba(0,0,0,.15)}
#notesBtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* 밑줄 + 글자 */
.pin.uln{height:0;padding:0;background:none;border:none;border-bottom:3px solid var(--c);border-radius:0;box-shadow:none;transform:none;white-space:nowrap}
.pin.uln::before{content:"";position:absolute;left:0;right:0;bottom:-8px;height:16px}
.pin.uln .ulab{position:absolute;left:100%;bottom:-13px;margin-left:6px;background:var(--cbg);color:var(--ct);border:2px solid var(--c);border-radius:999px;padding:1px 10px;font-size:14px;font-weight:800;line-height:1.5;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pin.uln.lft .ulab{left:auto;right:100%;margin:0 6px 0 0}
.pin.uln.sel .ulab,.pin.uln.hl .ulab{outline:3px solid var(--c);outline-offset:1px}
.pin.uln.sel,.pin.uln.hl{outline:none;border-bottom-width:4px}
.pin.uln.ultmp{pointer-events:none;opacity:.85}
.pin.uln.floating{transform:none}
/* 형광펜 */
.pin.hlt{padding:0;background:none;border:none;box-shadow:none;transform:none;border-radius:0;pointer-events:none;white-space:nowrap}
.pin.hlt.mc{--hl:rgba(255,107,107,.18)}
.pin.hlt.memo{--hl:rgba(255,212,0,.25)}
.pin.hlt.task{--hl:rgba(76,110,245,.15)}
.pin.hlt .hr{position:absolute;display:block;background:var(--hl);mix-blend-mode:multiply;border-radius:3px;pointer-events:auto;cursor:pointer}
body.edit .pin.hlt .hr{cursor:grab}
.pin.hlt .hh{position:absolute;top:-4px;bottom:-4px;width:10px;background:var(--c);border-radius:5px;opacity:0;cursor:ew-resize;pointer-events:auto;touch-action:none;transition:opacity .12s}
.pin.hlt .hh.l{left:-5px}
.pin.hlt .hh.r{right:-5px}
.pin.hlt .hh::before{content:"";position:absolute;inset:-6px -8px}
body.edit .pin.hlt:hover .hh,body.edit .pin.hlt.sel .hh,.pin.hlt.resizing .hh{opacity:.85}
@media (pointer:coarse){ body.edit .pin.hlt .hh{opacity:.55;width:14px} body.edit .pin.hlt .hh.l{left:-7px} body.edit .pin.hlt .hh.r{right:-7px} }
.pin.hlt.labghost{width:auto;height:auto}
.pin.hlt.labghost .ulab{position:static;transform:none;margin:0;display:inline-block}
.pin.hlt .ulab.dragging{opacity:0}
body.edit .pin.hlt .ulab{cursor:grab}
.pin.hlt .ulab{position:absolute;right:100%;top:var(--labtop,0);transform:translateY(-28%);margin-right:6px;pointer-events:auto;cursor:pointer;background:var(--cbg);color:var(--ct);border:3px solid var(--c);border-radius:999px;padding:4px 15px;font-size:18px;font-weight:800;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pin.hlt.sel .hr,.pin.hlt.hl .hr{box-shadow:0 0 0 2px var(--c)}
.pin.hlt.sel .ulab,.pin.hlt.hl .ulab{outline:3px solid var(--c);outline-offset:1px}
.pin.hlt.sel,.pin.hlt.hl{outline:none}

   ========================================================= */
:root{

  --accent:#23433A; --accent-soft:#E2ECE7; --star:#E3A81B; --warn:#C9412F; --warn-soft:#FBEDEA;
  --ok:#2F7A4B; --ok-soft:#E4F2E9; --memo:#FFF8DC; --memo-line:#E6D46A; --pdfbg:#E1E8E4;

}
body{font-family:var(--sans);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;background-color:var(--bg)}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}

.btn{border-color:#C4D0CA;background:var(--panel);font-weight:500;border-radius:8px}
.btn:hover{background:#EAF0ED;border-color:#AFC0B8}
.btn.primary{font-weight:700}
.btn.primary:hover{filter:brightness(1.12)}
.iconbtn:hover{background:rgba(35,67,58,.08)}

/* 서재 */
body:has(#library:not(.hidden)){background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
#library{padding-top:44px}
.libtop{padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:8px}
#library h1{font-family:var(--serif);font-size:40px;font-weight:700;letter-spacing:-1px}
.homelink{background:var(--panel);border-color:#C4D0CA;color:var(--ink);font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.homelink:hover{color:var(--accent);border-color:var(--accent)}
.libsec{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink)}
.books{gap:18px}
.book{position:relative;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;padding:18px 16px 14px 28px;border:1px solid var(--line);border-radius:3px 8px 8px 3px;background:var(--panel);box-shadow:var(--shadow)}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--board);border-radius:3px 0 0 3px;box-shadow:inset -2px 0 0 rgba(0,0,0,.18)}
.book:hover{border-color:var(--board);box-shadow:0 0 0 1px var(--board)}
.book .nm{font-family:var(--serif);font-size:18px;line-height:1.4}
.book .meta{font-size:13px}
.book.need,.book.remote{background:#F7FAF8;border:2px dashed #BCCBC4}
.book.need::before,.book.remote::before{background:#BCCBC4;box-shadow:none}
.book.need .nm{color:var(--sub)}
.book .meta .go{color:var(--accent)}
.libio,.syncbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:none}

/* 작업 화면: 상단 칠판 */
header.top{background:var(--board);color:var(--chalk);border-bottom:4px solid rgba(0,0,0,.2)}
header.top .title{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--chalk)}
header.top .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:var(--chalk)}
header.top .btn:hover{background:rgba(255,255,255,.16)}
header.top .iconbtn{color:rgba(244,247,242,.85)}
header.top .iconbtn:hover{background:rgba(255,255,255,.12);color:#fff}
header.top .pageinfo{color:rgba(244,247,242,.8);font-variant-numeric:tabular-nums}
header.top .pageinfo input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:#fff}
#bmBtn.on,#padBtn.on{background:var(--hl);border-color:var(--hl);color:var(--ink)}
/* 목차 / 지도서 / 정리: 바인더 색인 탭 */
#viewTabs{border:none;border-radius:0;gap:6px;background:none;overflow:visible}
#viewTabs button{background:rgba(255,255,255,.1);color:rgba(244,247,242,.85);border-radius:8px 8px 0 0;font-weight:700;box-shadow:inset 0 -3px 0 transparent}

.seg{border-color:rgba(255,255,255,.28)}

/* 가운데: 모눈지 위의 지도서 */
#viewer{background-color:var(--pdfbg);background-image:linear-gradient(#D3DCD7 1px,transparent 1px),linear-gradient(90deg,#D3DCD7 1px,transparent 1px);background-size:22px 22px}
.pagebox{box-shadow:0 1px 2px rgba(20,40,30,.18),0 8px 22px rgba(20,40,30,.12)}
.pagebox .pno{color:var(--sub);font-variant-numeric:tabular-nums}
#palette{border-radius:12px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(20,40,30,.18)}
#palette .ph{font-family:var(--serif);color:var(--ink)}
.tool{border-color:var(--line);border-radius:10px}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool.on{outline-color:var(--hl);background:var(--hl-soft)}

/* 왼쪽 차례 */

.su{border-radius:0 6px 6px 0;border-left-width:4px}

.su.sel{background:var(--accent-soft);border-left-color:var(--accent)}

.minstars{background:var(--hl-soft);color:#6B5800}
.bm:hover{background:#EEF3F0}

/* 오른쪽 정리 */
aside.panel{background:var(--panel)}
.phead{background:var(--panel);border-bottom:2px solid var(--ink)}
.phead h2,.phead.sum h2{font-family:var(--serif);font-size:23px;line-height:1.35;letter-spacing:-.3px}

.sec{border-bottom:10px solid var(--bg)}
.sec h3{font-family:var(--serif)}
.item{border-radius:6px;background:#fff}
.item:hover{border-color:var(--accent)}
.prog{background:#E3EAE6}
.lvlbig,.lvl .lt{color:#6B5800}
.lvlbig{background:var(--hl-soft)}

/* 문제 = 감청 */
.pin.num.task,.pin.uln.task,.pin.hlt.task,.mnote.task,.sec-task,.chip.task{--c:#2B4170;--cbg:#E4E9F3;--ct:#22355E}
.pin.hlt.task{--hl:rgba(43,65,112,.15)}
.pin.task{background:var(--navy)}
.pin.num.mc,.pin.uln.mc,.pin.hlt.mc,.mnote.mc,.sec-mc,.chip.mc{--c:#C9412F;--cbg:#FBEDEA;--ct:#9E2F21}

.mnote{border-radius:8px 0 0 8px}
.mnote.msum{--c:var(--accent);--ct:var(--board);background:#F3F7F5}
.mnote.msum .sumt{font-family:var(--serif);color:var(--ink)}
.mnote .go{color:var(--navy)}

/* 문제 풀이 전체 화면 */
.fs{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.fs .fh{background:var(--panel);border-bottom:2px solid var(--accent)}
.fs .fh .t{font-family:var(--serif)}
.card{border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--panel)}
.card h4{font-family:var(--serif);font-size:17px}
.qcard{border-top:5px solid var(--navy)}
.qcard .qbig{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.8}
.fs textarea.big2{background-color:#fff;background-image:linear-gradient(transparent calc(1.7em - 1px),#E3EAE6 1px);background-size:100% 1.7em;background-attachment:local;background-position:0 12px}
.result{border-color:#BFD3C9;background:var(--accent-soft)}
.result .score{font-family:var(--serif);color:var(--accent);font-size:30px}

.bar i{background:var(--accent)}

/* 창 */
.modal{background:rgba(18,34,28,.45)}

.mc{border-color:#EDC3BB;border-radius:8px}

.toast{background:var(--ink);border-radius:999px;border-left:6px solid var(--hl);padding:11px 20px}
.pickbar{background:var(--ink);border-left:6px solid var(--hl)}
.mfield{border-color:var(--accent)}

/* ---------- 오른쪽 정리 칸 없앰 → 교과서 + (열면) 메모장 ---------- */
aside.panel{display:none!important}
.main{grid-template-columns:270px 1fr}

.padmode button.on{background:var(--board,#23433A);color:#fff}
.padink{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.padink .sp{flex:1}
.pcols,.pws{display:inline-flex;gap:5px;align-items:center}

.pw i{display:block;border-radius:50%;background:var(--ink)}
.pw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.pad:not(.inking) .padink .pcol,.pad:not(.inking) .padink .pw{opacity:.45}
.padscroll{flex:1;min-height:0;overflow:auto;background:#EEF1EF}

#padText{position:absolute;inset:0;width:100%;height:100%;border:none;resize:none;overflow:hidden;background:transparent;font-size:16px;line-height:32px;padding:8px 16px 0 22px;color:#1E2B27;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#DCE6F0 31px 32px);background-position:0 8px}
#padText:focus{outline:none}
#padInk{position:absolute;left:0;top:0;pointer-events:none;touch-action:none}
.pad.inking #padInk{pointer-events:auto;cursor:crosshair}
.pad.erasing #padInk{cursor:cell}
body.docking .pad{display:none}
@media (max-width:1023px){
  .main{grid-template-columns:1fr}
  body.padOn .main{grid-template-columns:1fr}
  body.padOn .pad{display:flex!important;position:fixed;inset:0;z-index:40;border:none}
}

   tbl:teach            선생님 분석 {exportedAt, books:{이름:{pages, subunits}}}  — 읽기 전용

function renderLibrary() {
  const box = $('#books');
  const T = getTeach().books, names = Object.keys(T);
  const linked = new Set(S.books.map(b => b.analysis));
  const card = (b) => {
    const t = T[b.analysis], mine = lsGet(mineKey(b.analysis), []).length, bm = lsGet(bmKey(b.analysis), []).length;
    return `<div class="book" data-id="${b.id}">
      <div class="nm">📗 ${esc(b.analysis)}</div>
      <div class="meta"><span>${b.pages}쪽 · 소단원 ${t ? t.subunits.length : 0}${mine ? ` · 내 노트 ${mine}` : ''}${bm ? ` · 🔖${bm}` : ''}</span>
      <button class="iconbtn del" data-id="${b.id}" title="PDF 지우기">🗑</button></div></div>`;
  };
  // 앱에 함께 담긴 PDF(교과서PDF 폴더)가 있는 분석은 바로 열 수 있음 — 처음 열 때 한 번만 이 기기에 저장
  const PL = window.TBA_PDF_LIST || {};
  // 순서: 중1 → 중2 → 중3 → 공통수학1 → 공통수학2
  const rank = n => { let m = n.match(/공통\s*수학\s*([12])/); if (m) return 3 + +m[1]; m = n.match(/수학\s*([123])/); return m ? +m[1] : 9; };
  const byRank = (a, b) => rank(a) - rank(b) || a.localeCompare(b, 'ko');
  const rest = names.filter(n => !linked.has(n)).sort(byRank);
  const mineCards = [
    ...S.books.map(b => ({n: b.analysis, h: card(b)})),
    ...rest.filter(n => PL[n]).map(n => ({n, h: `<div class="book" data-pack="${esc(n)}">
      <div class="nm">📗 ${esc(n)}</div>
      <div class="meta"><span>${T[n].pages || '?'}쪽 · 소단원 ${T[n].subunits.length}</span><span class="go">처음 열 때 한 번 담아요 ›</span></div></div>`}))
  ].sort((a, b) => byRank(a.n, b.n));
  const packed = mineCards.map(x => x.h).join('');
  const need = rest.filter(n => !PL[n]).map(n => `<div class="book need" data-need="${esc(n)}">
      <div class="nm">📄 ${esc(n)}</div>
      <div class="meta"><span>${T[n].pages || '?'}쪽 · 소단원 ${T[n].subunits.length}</span><span class="go">PDF 연결 ›</span></div></div>`).join('');
  // 인터넷 주소에서 교과서 PDF가 빠져 있으면 폴더 넣기 안내
  $('#dropIn').classList.toggle('hidden', GD_ONFILE || (names.length > 0 && !rest.length));
  box.innerHTML = (packed ? `<div class="libsec" style="grid-column:1/-1">내 교과서</div>${packed}` : '')
    + (need ? `<div class="libsec" style="grid-column:1/-1">PDF를 연결하면 열 수 있어요</div>${need}` : '')
    + (!names.length ? `<div class="empty" style="grid-column:1/-1">${GD_ONFILE ? '분석 자료가 없어요. 아래 <b>분석 파일 업데이트</b>로 교과서분석_모음.json을 불러오세요.'
      : '교과서가 아직 없어요. 구글 드라이브에 연결돼 있으면 저장해 둔 교과서가 곧 나와요. 처음이라면 위의 안내대로 「임용 준비」 폴더를 이 화면에 끌어다 놓아 주세요.'}</div>` : '');
}

/* ---------- 앱에 담긴 교과서 PDF (교과서PDF/목록.js + 조각 파일) ----------
   file:// 로 열어도 되도록 PDF를 base64 조각(.js)으로 나눠 담아 둠. 처음 한 번 읽어서 IndexedDB에 저장 */
const PACK_DIR = '교과서PDF/';
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = () => { s.remove(); res(); };
    s.onerror = () => { s.remove(); rej(new Error('파일을 찾지 못했어요: ' + src)); };
    document.head.appendChild(s);
  });
}
let packing = false;
async function openPacked(name) {
  const info = (window.TBA_PDF_LIST || {})[name]; if (!info || packing) return;
  packing = true;
  const bar = document.createElement('div'); bar.className = 'toast'; document.body.appendChild(bar);
  try {
    const parts = [];
    for (let i = 1; i <= info.parts; i++) {
      bar.textContent = `교과서 PDF를 이 기기에 담는 중… ${Math.round((i - 1) / info.parts * 100)}% (처음 한 번만)`;
      await loadScript(PACK_DIR + `${info.file}_${String(i).padStart(2, '0')}.js`);
      const k = `${info.file}#${i}`, b64 = window.TBA_PDF_PARTS?.[k]; delete window.TBA_PDF_PARTS?.[k];
      if (!b64) throw new Error(`조각 ${i}을 읽지 못했어요.`);
      const bin = atob(b64), u = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j);
      parts.push(u);
    }
    bar.textContent = '교과서 PDF를 여는 중…';
    await addPdf(new File(parts, name + '.pdf', {type: 'application/pdf'}), name);
  } catch (err) { console.error(err); toast('교과서 PDF를 담지 못했어요: ' + err.message); }
  finally { bar.remove(); packing = false; }
}
$('#pdfInput').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) addPdf(f, needName); needName = null; };

/* ---------- 내 컴퓨터 폴더 넣기 (인터넷 주소에서 처음 한 번) ----------
   「임용 준비」 폴더를 서재에 끌어다 놓거나 골라 주면, 그 안에서 분석 자료(교과서분석_데이터.js)와
   교과서 PDF(교과서PDF 폴더 조각, 또는 분석 이름과 같은 .pdf)만 골라 읽어 이 브라우저에 담음.
   구글 드라이브에 연결돼 있으면 드라이브에도 올라감 (교과서 PDF는 공개 주소에 두지 않음) */
const FOLDER_WANT = p => /(^|\/)교과서분석_데이터\.js$/.test(p) || /(^|\/)교과서PDF\/[^/]+\.js$/.test(p) || /\.pdf$/i.test(p);
async function walkEntry(entry, path, out, depth) {
  if (entry.isFile) { if (FOLDER_WANT(path)) out.push({path, file: await new Promise((res, rej) => entry.file(res, rej))}); return; }
  if (depth > 5 || /^(\.|node_modules$)/.test(entry.name)) return;
  const rd = entry.createReader();
  for (;;) {
    const batch = await new Promise((res, rej) => rd.readEntries(res, rej)); if (!batch.length) break;
    for (const e of batch) await walkEntry(e, path + '/' + e.name, out, depth + 1);
  }
}
const jsObject = t => JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));   // "window.X = {...};" 에서 {...}만
let folderBusy = false;
async function importFolder(files) {
  if (folderBusy) return; folderBusy = true;
  const bar = document.createElement('div'); bar.className = 'toast'; document.body.appendChild(bar);
  const say = t => bar.textContent = t;
  let added = 0, teach = false;
  try {
    const dataF = files.find(x => /(^|\/)교과서분석_데이터\.js$/.test(x.path));
    const listF = files.find(x => /(^|\/)교과서PDF\/목록\.js$/.test(x.path));
    const pdfs = files.filter(x => /\.pdf$/i.test(x.path));
    if (!dataF && !listF && !pdfs.length) { toast('교과서 자료를 찾지 못했어요. 「임용 준비」 폴더를 통째로 넣어 주세요.'); return; }
    if (dataF) { say('분석 자료를 읽는 중…'); await loadImgs(); teach = await loadTeach(jsObject(await dataF.file.text()), true); }
    const T = getTeach().books, have = n => S.books.some(b => b.analysis === n);
    const keep = async (name, blob) => {
      const id = uid(); await pdfPut(id, blob);
      S.books.push({id, name, analysis: name, pages: T[name]?.pages || 0, added: Date.now()}); saveBooks(); added++;
    };
    if (listF) {
      const L = jsObject(await listF.file.text()), dir = listF.path.replace(/목록\.js$/, ''), names = Object.keys(L).filter(n => !have(n));
      for (const [k, name] of names.entries()) {
        const info = L[name], parts = [];
        for (let i = 1; i <= info.parts; i++) {
          say(`교과서 PDF를 담는 중 (${k + 1}/${names.length}) ${name} · ${Math.round((i - 1) / info.parts * 100)}%`);
          const f = files.find(x => x.path === `${dir}${info.file}_${String(i).padStart(2, '0')}.js`);
          if (!f) throw new Error(`'${name}'의 조각 파일 ${i}을 찾지 못했어요.`);
          const s = await f.file.text();
          parts.push(await (await fetch('data:application/octet-stream;base64,' + s.slice(s.indexOf('="') + 2, s.lastIndexOf('"')))).blob());
        }
        await keep(name, new Blob(parts, {type: 'application/pdf'}));
      }
    }
    // 분석 이름과 같은 이름의 PDF 파일도 담음 (조각이 없는 교과서)
    for (const p of pdfs) {
      const name = p.file.name.replace(/\.pdf$/i, '').trim();
      if (T[name] && !have(name)) { say(`교과서 PDF를 담는 중 · ${name}`); await keep(name, new Blob([p.file], {type: 'application/pdf'})); }
    }
    renderLibrary();
    toast(added || teach ? `${teach ? '분석 자료' : ''}${teach && added ? '와 ' : ''}${added ? `교과서 ${added}권` : ''}을 담았어요` + (GD.on ? ' · 구글 드라이브에 올리는 중이에요 (다 올라갈 때까지 창을 열어 두세요)' : '') : '이미 다 담겨 있어요.');
  } catch (e) { console.error(e); toast('폴더를 읽다 멈췄어요: ' + e.message); }
  finally { bar.remove(); folderBusy = false; gdShow(); }
}
// 서재 어디에든 끌어다 놓기
const libEl = $('#library');
libEl.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); libEl.classList.add('dragging'); } });
libEl.addEventListener('dragleave', e => { if (!libEl.contains(e.relatedTarget)) libEl.classList.remove('dragging'); });
libEl.addEventListener('drop', async e => {
  if (![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); libEl.classList.remove('dragging');
  const entries = [...e.dataTransfer.items].map(it => it.webkitGetAsEntry?.()).filter(Boolean);   // 놓는 순간에 받아 둬야 함
  if (!entries.length) return;
  toast('폴더를 살펴보는 중…');
  const out = [];
  try { for (const en of entries) await walkEntry(en, en.name, out, 0); } catch (err) { return toast('폴더를 읽지 못했어요: ' + err.message); }
  importFolder(out);
});
// 끌어다 놓기가 어려우면 폴더 고르기
$('#folderPick').onclick = () => $('#folderInput').click();
$('#folderInput').onchange = e => {
  const files = [...e.target.files].map(f => ({path: f.webkitRelativePath || f.name, file: f})).filter(x => FOLDER_WANT(x.path));
  e.target.value = ''; importFolder(files);
};

async function addPdf(file, analysis) {
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return toast('PDF 파일만 올릴 수 있어요.');
  toast('PDF를 읽는 중…');
  try {
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
    const want = getTeach().books[analysis]?.pages;
    if (want && want !== doc.numPages && !confirm(`분석 자료는 ${want}쪽인데 이 PDF는 ${doc.numPages}쪽이에요.\n쪽이 어긋날 수 있어요. 그래도 연결할까요?`)) { doc.destroy(); return; }
    const id = uid();
    await pdfPut(id, new Blob([buf], {type: 'application/pdf'}));
    S.books = S.books.filter(b => b.analysis !== analysis);
    S.books.unshift({id, name: file.name.replace(/\.pdf$/i, ''), analysis, pages: doc.numPages, added: Date.now()});
    saveBooks(); doc.destroy();
    openBook(id);
  } catch (err) { console.error(err); toast('PDF를 열 수 없어요: ' + err.message); }
}

/* =========================================================
   책 열기 / PDF 표시
   ========================================================= */
// 선생님 분석 + 내 노트 합치기
function buildData(key) {
  const t = getTeach().books[key];
  const subs = JSON.parse(JSON.stringify(t?.subunits || [])).map(s => normalizeSu({...newSu('', 1), ...s}));
  subs.forEach(s => { s.memos.forEach(x => delete x.mine); s.misconceptions.forEach(x => delete x.mine); });
  const data = {subunits: subs};
  for (const m of lsGet(mineKey(key), [])) {
    const {type, su, ...it} = m; it.mine = true;
    let s = subs.find(x => x.id === su) || (it.pos && [...subs].sort((a, b) => a.page - b.page).filter(x => x.page <= it.pos.page).pop()) || subs[0];
    if (!s) { s = newSu('내 노트', 1); subs.push(s); }
    s[TYPES[type].list].push(it);
  }
  return data;
}
async function openBook(id) {
  const b = S.books.find(x => x.id === id); if (!b) return;
  const blob = await pdfGet(id);
  if (!blob) return toast('저장된 PDF를 찾을 수 없어요.');
  S.book = b; S.key = b.analysis;
  await loadImgs();
  S.data = buildData(S.key); S.selItem = null;
  S.answers = lsGet(ansKey(S.key), {});
  S.bms = lsGet(bmKey(S.key), []);
  S.sel = S.data.subunits[0]?.id || null;
  $('#library').classList.add('hidden'); $('#work').classList.remove('hidden');
  $('#bookTitle').textContent = b.analysis;
  if (S.pdf) { S.pdf.destroy(); S.pdf = null; }
  S.pdf = await pdfjsLib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
  $('#pageTotal').textContent = S.pdf.numPages;
  const p1 = await S.pdf.getPage(1);
  S.baseVp = p1.getViewport({scale: 1});
  setView('pdf');
  S.cur = 1;
  buildPages();
  if (!isNarrow() && $('#pages').scrollWidth > $('#viewer').clientWidth + 4) fitWidth();
  const last = Math.min(+lsGet(lastKey(S.key), 0) || 0, S.pdf.numPages);
  if (last > 1) {
    S.cur = last; $('#pageJump').value = last; goPage(last, false);
    const su = suAtPage(last); if (su) S.sel = su.id;
  }
  if (isNarrow()) requestAnimationFrame(fitWidth);
  renderToc(); renderPanel(); renderBms();
  padLoad();
}
$('#backBtn').onclick = () => {
  padFlush();
  if (S.key) { lsSet(lastKey(S.key), S.cur); clearTimeout(saveTimer); lsSet(mineKey(S.key), collectMine()); }
  if (S.observer) S.observer.disconnect();
  $('#pages').innerHTML = ''; S.pageEls = [];
  if (S.pdf) { S.pdf.destroy(); S.pdf = null; }
  $('#work').classList.add('hidden'); $('#library').classList.remove('hidden');
  renderLibrary();
};
addEventListener('pagehide', () => { padFlush(); if (S.key && S.data) { lsSet(lastKey(S.key), S.cur); lsSet(mineKey(S.key), collectMine()); } });

/* =========================================================
   책갈피
   ========================================================= */
const saveBms = () => lsSet(bmKey(S.key), S.bms);
function renderBms() {
  const box = $('#bmList');
  const list = [...S.bms].sort((a, b) => a.page - b.page);
  box.innerHTML = list.length ? list.map(m => `<div class="bm" data-id="${m.id}"><span class="bi">🔖</span><span class="t" title="${esc(m.title)}">${esc(m.title)}</span><span class="pg">${m.page}쪽</span>
    <button class="iconbtn" data-a="ren" title="이름 바꾸기">✎</button><button class="iconbtn" data-a="del" title="지우기">✕</button></div>`).join('')
    : '<div class="note" style="padding:4px 10px 8px">🔖 버튼으로 지금 쪽을 저장</div>';
  for (let n = 1; n < S.pageEls.length; n++) S.pageEls[n].querySelector('.ribbon')?.remove();
  for (const m of S.bms) {
    const box2 = S.pageEls[m.page]?.querySelector('.pagebox'); if (!box2 || box2.querySelector('.ribbon')) continue;
    box2.insertAdjacentHTML('beforeend', `<div class="ribbon" data-page="${m.page}" title="🔖 ${esc(m.title)}"></div>`);
  }
  $('#bmBtn').classList.toggle('on', S.bms.some(m => m.page === S.cur));
}
function bmTitle(m) {
  modal('🔖 책갈피 이름', `<input type="text" id="bmName" value="${esc(m.title)}">`, [
    {label: '취소'}, {label: '저장', primary: true, onClick: box => { m.title = box.querySelector('#bmName').value.trim() || m.title; saveBms(); renderBms(); }}
  ], box => { const i = box.querySelector('#bmName'); i.focus(); i.select(); i.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) box.querySelector('.mf .primary').click(); }; });
}
$('#bmBtn').onclick = () => {
  const ex = S.bms.find(m => m.page === S.cur);
  if (ex) { S.bms = S.bms.filter(m => m !== ex); saveBms(); renderBms(); return toast(`${S.cur}쪽 책갈피를 지웠어요.`); }
  const su = suAtPage(S.cur);
  const m = {id: uid(), page: S.cur, title: su?.title || `${S.cur}쪽`, at: Date.now()};
  S.bms.push(m); saveBms(); renderBms(); bmTitle(m);
};
$('#bmList').addEventListener('click', e => {
  const row = e.target.closest('.bm'); if (!row) return;
  const m = S.bms.find(x => x.id === row.dataset.id); if (!m) return;
  const a = e.target.closest('[data-a]')?.dataset.a;
  if (a === 'del') { S.bms = S.bms.filter(x => x !== m); saveBms(); renderBms(); return; }
  if (a === 'ren') return bmTitle(m);
  if (isNarrow()) { S.cur = m.page; setView('pdf'); } else goPage(m.page);
});

function buildPages() {
  const wrap = $('#pages'); wrap.innerHTML = ''; S.pageEls = [null];
  if (S.observer) S.observer.disconnect();
  S.observer = new IntersectionObserver(entries => {
    for (const en of entries) {
      const n = +en.target.dataset.n;
      if (en.isIntersecting) renderPage(n); else unrenderPage(n);
    }
  }, {root: $('#viewer'), rootMargin: '1200px 0px'});
  const w = S.baseVp.width * S.scale, h = S.baseVp.height * S.scale;
  const frag = document.createDocumentFragment();
  for (let n = 1; n <= S.pdf.numPages; n++) {
    const row = document.createElement('div'); row.className = 'prow'; row.dataset.n = n;
    row.innerHTML = `<div class="rail"></div><div class="margin"></div><div class="pagebox" style="width:${w}px;height:${h}px"><canvas></canvas><div class="pins"></div><span class="pno">${n}쪽</span></div>`;
    frag.appendChild(row); S.pageEls.push(row);
  }
  wrap.appendChild(frag);
  S.pageEls.slice(1).forEach(r => S.observer.observe(r));
  $('#zoomLbl').textContent = Math.round(S.scale * 100) + '%';
  renderRails(); renderPins(); renderBms();
}

const rendering = new Map();
async function renderPage(n) {
  const row = S.pageEls[n]; if (!row || row.dataset.r === String(S.scale) || rendering.has(n)) return;
  const scale = S.scale;
  const job = (async () => {
    const page = await S.pdf.getPage(n);
    const vp = page.getViewport({scale});
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const box = row.querySelector('.pagebox'), cv = row.querySelector('canvas');
    box.style.width = vp.width + 'px'; box.style.height = vp.height + 'px';
    cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
    cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null}).promise;
    if (scale === S.scale) row.dataset.r = String(scale);
  })().catch(e => console.warn('render', n, e)).finally(() => rendering.delete(n));
  rendering.set(n, job);
}
function unrenderPage(n) {
  const row = S.pageEls[n]; if (!row || !row.dataset.r) return;
  const cv = row.querySelector('canvas'); cv.width = 0; cv.height = 0; delete row.dataset.r;
}

function setZoom(z) {
  const keep = S.cur;
  S.scale = Math.max(0.5, Math.min(3, Math.round(z * 10) / 10)); lsSet('tbl:scale', S.scale);
  buildPages(); goPage(keep, false);
}
$('#zoomIn').onclick = () => setZoom(S.scale + 0.1);
$('#zoomOut').onclick = () => setZoom(S.scale - 0.1);

/* ---------- 태블릿: 화면 전환 / 폭 맞춤 ---------- */
const isNarrow = () => matchMedia('(max-width:1023px)').matches;
function setView(v) {
  document.body.dataset.view = v;
  $('#viewTabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'pdf' && S.pdf) requestAnimationFrame(() => goPage(S.cur, false));
}
$('#viewTabs').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
function fitWidth() {
  if (!S.baseVp) return;
  const v = $('#viewer'); if (!v.clientWidth) return;
  const rail = isNarrow() ? 0 : $('.rail')?.offsetWidth + 10 || 180;
  const pal = palW() + (S.showNotes && !notesStacked() ? 270 : 0);
  setZoom((v.clientWidth - rail - pal - (isNarrow() ? 24 : 40)) / S.baseVp.width);
}
let lastNarrow = isNarrow();
window.addEventListener('resize', () => {
  clearTimeout(window._rz);
  window._rz = setTimeout(() => {
    const n = isNarrow();
    if (n && S.pdf && document.body.dataset.view === 'pdf') fitWidth();   // 태블릿 회전 시 다시 맞춤
    if (n !== lastNarrow && S.pdf) { lastNarrow = n; goPage(S.cur, false); }
    if (S.pdf && S.mode === 'learn') renderPins();
  }, 250);
});

function goPage(n, smooth = true) {
  n = Math.max(1, Math.min(S.pdf.numPages, n | 0));
  const row = S.pageEls[n]; if (!row) return;
  $('#viewer').scrollTo({top: row.offsetTop - 10, behavior: smooth ? 'smooth' : 'auto'});
}
$('#pageJump').onkeydown = e => { if (e.key === 'Enter') goPage(+e.target.value); };

// 현재 보고 있는 쪽 추적
let scrollRaf;
$('#viewer').addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = null;
    const v = $('#viewer'); const mid = v.scrollTop + v.clientHeight * 0.35;
    let lo = 1, hi = S.pageEls.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (S.pageEls[m].offsetTop <= mid) lo = m; else hi = m - 1; }
    if (lo !== S.cur) { S.cur = lo; $('#pageJump').value = lo; markHere(); $('#bmBtn').classList.toggle('on', S.bms.some(m => m.page === lo)); }
  });
});

/* =========================================================
   소단원 데이터 helpers
   ========================================================= */
const sorted = () => [...S.data.subunits].sort((a, b) => a.page - b.page);
const getSu = id => S.data.subunits.find(s => s.id === id);
function newSu(title, page, unit = '') {
  return {id: uid(), unit, title, page, stars: 0, tasks: [], memos: [], misconceptions: [], marks: []};
}
function suAtPage(p) {
  let found = null;
  for (const s of sorted()) { if (s.page <= p) found = s; else break; }
  return found;
}
const starStr = n => '★'.repeat(n);
const lvlText = n => n ? `중요도 <span class="stc">${'★'.repeat(n)}</span>` : '중요도 미정';
// 중요도 1~5 고르는 버튼 (별 대신 숫자)
const lvlButtons = (v, dis = '') => [1,2,3,4,5].map(i => `<button type="button" data-v="${i}" class="${i <= v ? 'on' : ''}" ${dis}>★</button>`).join('');

/* =========================================================
   왼쪽 목차
   ========================================================= */
function renderToc() {
  const list = $('#tocList'); const subs = sorted();
  if (!subs.length) {
    list.innerHTML = `<div class="empty">${S.mode === 'edit'
      ? '아직 소단원이 없어요.<br>PDF를 넘기다가 소단원이 시작되는 쪽에서<br><b>＋ 소단원 추가</b>를 누르거나,<br>페이지 왼쪽의 <b>＋ 여기에 소단원</b>을 눌러 보세요.'
      : '아직 등록된 소단원이 없어요.'}</div>`;
    return;
  }
  let html = '', lastUnit = null;
  for (const s of subs) {
    if (s.unit !== lastUnit) { if (s.unit) html += `<div class="unit">${esc(s.unit)}</div>`; lastUnit = s.unit; }
    html += `<div class="su ${s.id === S.sel ? 'sel' : ''}" data-id="${s.id}">
      <div class="t">${esc(s.title || '(제목 없음)')}${s.stars ? `<div><span class="minstars">${lvlText(s.stars)}</span></div>` : ''}</div>
      <span class="pg">${s.page}쪽</span></div>`;
  }
  list.innerHTML = html; markHere();
}
function markHere() {
  const h = suAtPage(S.cur);
  document.querySelectorAll('.su').forEach(el => el.classList.toggle('here', !!h && el.dataset.id === h.id));
}
$('#tocList').addEventListener('click', e => {
  const el = e.target.closest('.su'); if (!el) return;
  selectSu(el.dataset.id, true);
});
function selectSu(id, scroll) {
  S.sel = id; renderToc(); renderRails(); renderPanel();
  if (isNarrow()) setView('pdf');   // 태블릿: 목차에서 고르면 지도서로
  const s = getSu(id); if (scroll && s) goPage(s.page);
}

/* =========================================================
   PDF 옆 소단원 꼬리표
   ========================================================= */
function renderRails() {
  for (let n = 1; n < S.pageEls.length; n++) S.pageEls[n].querySelector('.rail').innerHTML = '';
  const byPage = {};
  for (const s of S.data.subunits) (byPage[s.page] ||= []).push(s);
  for (let n = 1; n < S.pageEls.length; n++) {
    const rail = S.pageEls[n].querySelector('.rail');
    const list = byPage[n] || [];
    rail.innerHTML = list.map(s => {
      const ic = [];
      if (s.tasks.length) ic.push('✍️' + s.tasks.length);
      if (s.memos.length) ic.push('📝' + s.memos.length);
      if (s.misconceptions.length) ic.push('⚠️' + s.misconceptions.length);
      if (s.marks.length) ic.push('중요도' + s.marks.length);
      return `<div class="tag ${s.id === S.sel ? 'sel' : ''}" data-id="${s.id}">
        <div class="tt">${esc(s.title || '(제목 없음)')}</div>
        <div class="st">${lvlText(s.stars)}</div>
        ${ic.length ? `<div class="ic">${ic.join(' · ')}</div>` : ''}</div>`;
    }).join('') + `<button class="addhere" data-n="${n}">＋ 여기에 소단원</button>`;
  }
}
$('#pages').addEventListener('click', e => {
  const rb = e.target.closest('.ribbon');
  if (rb) { const m = S.bms.find(x => x.page === +rb.dataset.page); if (m) bmTitle(m); return; }
  const note = e.target.closest('.mnote'); if (note) return note.dataset.id && openItem(note.dataset.id);
  const pin = e.target.closest('.pin');
  if (pin) { if (S.mode !== 'edit') openItem(pin.dataset.id); return; }   // 편집 모드는 끌기/누르기로 처리
  const tag = e.target.closest('.tag'); if (tag) return selectSu(tag.dataset.id, false);
  const add = e.target.closest('.addhere'); if (add) addSu(+add.dataset.n);
});

function addSu(page) {
  const prev = suAtPage(page);
  const s = newSu('', page, prev ? prev.unit : '');
  S.data.subunits.push(s); saveData();
  selectSu(s.id, false);
  setTimeout(() => $('#panel input.ti')?.focus(), 30);
}
$('#addSuBtn').onclick = () => addSu(S.cur);

/* =========================================================
   PDF 목차(북마크)에서 불러오기
   ========================================================= */
$('#outlineBtn').onclick = async () => {
  const ol = await S.pdf.getOutline();
  if (!ol || !ol.length) return toast('이 PDF에는 목차(책갈피)가 없어요. 직접 소단원을 추가해 주세요.');
  const items = [];
  async function walk(nodes, depth, parent) {
    for (const n of nodes) {
      let page = null;
      try {
        const dest = typeof n.dest === 'string' ? await S.pdf.getDestination(n.dest) : n.dest;
        if (dest && dest[0]) page = typeof dest[0] === 'number' ? dest[0] + 1 : await S.pdf.getPageIndex(dest[0]) + 1;
      } catch {}
      const it = {title: (n.title || '').trim(), depth, page, parent, leaf: !(n.items && n.items.length)};
      items.push(it);
      if (n.items && n.items.length) await walk(n.items, depth + 1, it.title);
    }
  }
  await walk(ol, 0, '');
  const rows = items.map((it, i) => `<label class="olitem" style="padding-left:${it.depth * 18}px">
    <input type="checkbox" data-i="${i}" ${it.leaf && it.page ? 'checked' : ''} ${it.page ? '' : 'disabled'}>
    <span>${esc(it.title)}</span><span class="p">${it.page ? it.page + '쪽' : '-'}</span></label>`).join('');
  modal('📑 PDF 목차에서 불러오기', `<p class="note">소단원으로 만들 항목을 고르세요. 상위 항목의 이름이 <b>대단원</b>으로 들어갑니다.<br>이미 같은 쪽·같은 제목의 소단원이 있으면 건너뜁니다.</p>${rows}`,
    [{label: '취소'}, {label: '불러오기', primary: true, onClick: box => {
      let cnt = 0;
      box.querySelectorAll('input:checked').forEach(cb => {
        const it = items[+cb.dataset.i];
        if (S.data.subunits.some(s => s.page === it.page && s.title === it.title)) return;
        S.data.subunits.push(newSu(it.title, it.page, it.parent)); cnt++;
      });
      saveData(); renderToc(); renderRails(); toast(`소단원 ${cnt}개를 불러왔어요.`);
    }}]);
};

/* =========================================================
   교과서 위 항목(핀): 중요도 / ⚠️ 오개념 / 📝 메모 / ✍️ 문제
   ========================================================= */
const TYPES = {
  mark: {icon: '', name: '중요도',     list: 'marks'},
  mc:   {icon: '⚠️', name: '오개념',      list: 'misconceptions'},
  memo: {icon: '📝', name: '메모', list: 'memos'},
  task: {icon: '✍️', name: '문제',        list: 'tasks'}
};
function normalizeSu(s) {
  s.misconceptions ||= []; s.tasks ||= []; s.marks ||= [];
  if (!s.memos) s.memos = (s.memo || '').trim() ? [{id: uid(), text: s.memo, pos: null}] : [];
  delete s.memo;
  s.stars ||= 0; s.unit ||= ''; s.title ||= '';
  return s;
}
function allItems() {
  const out = [];
  for (const s of S.data.subunits) for (const type in TYPES) s[TYPES[type].list].forEach(it => out.push({s, type, it}));
  return out;
}
const findItem = id => allItems().find(x => x.it.id === id);
function newItem(type) {
  const base = {id: uid(), pos: null};
  if (type === 'mark') return {...base, stars: 3, note: ''};
  if (type === 'mc') return {...base, wrong: '', right: ''};
  if (type === 'memo') return {...base, text: ''};
  return {...base, question: '', model: '', rubric: [{id: uid(), text: ''}]};
}
function itemEmpty(type, it) {
  if (type === 'mc') return !it.wrong.trim() && !it.right.trim();
  if (type === 'memo') return !it.text.trim();
  if (type === 'task') return !it.question.trim() && !it.model.trim() && it.rubric.every(r => !(r.text || '').trim() && !(r.kw || '').trim());
  return false;
}
function refreshAll() { renderToc(); renderRails(); renderPins(); renderPanel(); }

function addItemAt(type, page, x, y, rects) {
  let s = suAtPage(page) || sorted()[0];
  if (!s) { s = newSu('내 노트', 1); S.data.subunits.push(s); }
  const it = newItem(type); it.mine = true; it.pos = rects ? {page, x, y, rects} : {page, x, y};
  S.editPage = page;
  s[TYPES[type].list].push(it); saveData();
  S.sel = s.id; S.selItem = it.id; refreshAll();
  openItem(it.id, true);
}
function moveLabel(id, page, x, y) {
  const f = findItem(id); if (!f) return;
  if (page !== f.it.pos.page) return toast('글자 버튼은 형광펜과 같은 쪽 안에서만 옮길 수 있어요.');
  f.it.pos.lab = {x, y}; S.selItem = id; S.editPage = page; saveData(); renderPins();
}
function moveItem(id, page, x, y) {
  const f = findItem(id); if (!f) return;
  const R = hlRects(f.it.pos);
  if (R) {                          // 형광펜: 칠한 조각을 모두 같이 옮김
    const b = bbox(R), nx = Math.max(0, Math.min(x, 1 - (b.x1 - b.x0))), ny = Math.max(0, Math.min(y, 1 - (b.y1 - b.y0)));
    const dx = nx - b.x0, dy = ny - b.y0;
    const lab = f.it.pos.lab ? {x: Math.min(0.96, Math.max(0, f.it.pos.lab.x + dx)), y: Math.min(0.98, Math.max(0, f.it.pos.lab.y + dy))} : undefined;
    f.it.pos = {page, x: nx, y: ny, rects: R.map(r => ({x0: r.x0 + dx, y0: r.y0 + dy, x1: r.x1 + dx, y1: r.y1 + dy})), ...(lab ? {lab} : {})};
  } else f.it.pos = {page, x, y};
  S.editPage = page;
  const ns = suAtPage(page);
  if (ns && ns !== f.s) {           // 다른 소단원 쪽으로 옮기면 그 소단원 소속으로
    const L = TYPES[f.type].list;
    f.s[L] = f.s[L].filter(x => x !== f.it); ns[L].push(f.it); S.sel = ns.id;
  }
  S.selItem = id; saveData(); refreshAll();
}
function deleteItem(id) {
  const f = findItem(id); if (!f) return;
  const L = TYPES[f.type].list;
  f.s[L] = f.s[L].filter(x => x !== f.it);
  if (f.type === 'task') { delete S.answers[id]; saveAnswers(); }
  if (S.selItem === id) S.selItem = null;
  saveData(); refreshAll();
}

/* ---------- 페이지 위 표시 그리기 ----------
   밑줄로 단 항목: 밑줄 + 옆에 '문제/메모/오개념' 글자
   점으로 단 항목(끌어다 놓기): 글자 버튼만 */
const TYPE_WORD = {task: '문제', memo: '메모', mc: '오개념'};
function pinLabel(type, it, s) {
  if (type === 'mark') return `중요도 <span class="stc">${'★'.repeat(it.stars)}</span>`;
  if (it.mine) return '내 ' + TYPE_WORD[type];
  const a = type === 'task' ? S.answers[it.id] : null;
  return TYPE_WORD[type] + (S.mode === 'learn' && a?.result ? ' ✔' : '');
}
// 편집 도구 자리: 화면이 넉넉할 때만 비워 두고, 좁으면 도구가 교과서 위에 떠 있게
const palW = () => { if (isNarrow()) return 0; const w = ($('#palette').offsetWidth || 132) + 30; return $('#viewer').clientWidth - w >= 520 ? w : 0; };
const notesStacked = () => isNarrow() || $('#viewer').clientWidth - palW() < 640;
function renderPins() {
  const on = S.showNotes;
  document.body.classList.toggle('notesOn', !!on);
  document.body.classList.toggle('mstack', !!on && notesStacked());
  document.body.style.setProperty('--palw', palW() + 'px');
  for (let n = 1; n < S.pageEls.length; n++) {
    S.pageEls[n].querySelector('.pins').innerHTML = '';
    const m = S.pageEls[n].querySelector('.margin'); m.innerHTML = ''; m.style.height = m.style.width = '';
  }
  const byPage = {};
  for (const x of allItems()) if (x.it.pos && S.pageEls[x.it.pos.page]) (byPage[x.it.pos.page] ||= []).push(x);
  for (const pg in byPage) {
    const row = S.pageEls[pg], list = byPage[pg];
    list.sort((a, b) => a.it.pos.y - b.it.pos.y || a.it.pos.x - b.it.pos.x);
    list.forEach(({s, type, it}) => {
      const el = document.createElement('div'), p = it.pos;
      const R = type !== 'mark' && hlRects(p);
      el.className = `pin ${type}${R ? ' hlt' : ''}${it.mine ? ' mine' : ''}${it.id === S.selItem ? ' sel' : ''}`;
      el.dataset.id = it.id;
      if (R) {
        hlFill(el, R); addHandles(el); el.insertAdjacentHTML('beforeend', `<span class="ulab">${pinLabel(type, it, s)}</span>`);
        if (p.lab) {                 // 글자 버튼을 따로 옮긴 자리

/* 왼쪽 여백 노트: 내가 쓴 글 (기본은 숨김, '내가 쓴 글 보기'로 켜기) */
function noteHtml({s, type, it}) {

/* ---------- 형광펜: 도구를 누른 뒤 교과서 글을 칠하기 ----------
   한 번 누르면 계속 칠할 수 있고(마우스를 떼었다 다시 눌러도 이어서), 도구 버튼이나 '다 칠했어요'를 누르면 끝 */

// 편집 모드: 칠한 조각 양 끝에 크기 조절 손잡이
function addHandles(el) { if (S.mode === 'edit') el.querySelectorAll('.hr').forEach(h => h.innerHTML = '<b class="hh l" title="끌어서 길이 조절"></b><b class="hh r" title="끌어서 길이 조절"></b>'); }

    <button class="btn small" data-a="undo">↶ 되돌리기</button><button class="btn small primary" data-a="done">다 칠했어요 <kbd style="font-size:11px;opacity:.8">Enter</kbd></button><button class="btn small" data-a="cancel">취소</button>`;

$('#pages').addEventListener('pointerdown', e => {
  if (!S.hl) return;

  e.preventDefault(); e.stopPropagation();

  if (S.hl.page && S.hl.page !== n) return toast('한 항목은 같은 쪽에만 칠할 수 있어요. 「다 칠했어요」를 누른 뒤 새로 시작해 주세요.');

  const tmp = document.createElement('div'); tmp.className = `pin hlt ${S.hl.type} hltmp hlnow`; box.querySelector('.pins').appendChild(tmp);
  const norm = () => {
    let x0 = Math.min(c.x0, c.x1), x1 = Math.max(c.x0, c.x1), y0 = Math.min(c.y0, c.y1), y1 = Math.max(c.y0, c.y1);

setNotes(false);

/* =========================================================
   내 메모장 (교과서마다 하나) — 키보드 글 + 펜 글씨를 한 장에
   IndexedDB 'pad:<분석이름>' = {text, strokes:[{c, w, p:[[x,y],…]}]}  (x, y는 종이 폭 400 기준 좌표)
   ========================================================= */
const PAD_W = 400, PAD_COLS = ['#1E2B27', '#E03131', '#1971C2', '#2F9E44'], PAD_WS = [1.5, 3, 6];

const padEl = id => document.getElementById(id);
$('.pcols').innerHTML = PAD_COLS.map((c, i) => `<button class="pcol ${i ? '' : 'on'}" data-c="${c}" style="--k:${c}" title="펜 색" aria-label="펜 색 ${i + 1}"></button>`).join('');
$('.pws').innerHTML = PAD_WS.map((w, i) => `<button class="pw ${i ? '' : 'on'}" data-w="${w}" title="펜 굵기" aria-label="펜 굵기 ${i + 1}"><i style="width:${w * 2 + 3}px;height:${w * 2 + 3}px"></i></button>`).join('');
const padScale = () => padEl('padPaper').clientWidth / PAD_W;
function padSize() {
  const paper = padEl('padPaper'), ta = padEl('padText'), cv = padEl('padInk');
  if (!paper.clientWidth) return;
  const k = padScale();
  const inkB = P.strokes.reduce((m, s) => Math.max(m, ...s.p.map(q => q[1])), 0) * k;
  ta.style.height = '0px';
  const need = Math.max(1400, ta.scrollHeight + 320, inkB + 400);
  ta.style.height = '';
  paper.style.height = need + 'px';
  const dpr = Math.min(devicePixelRatio || 1, 2), W = paper.clientWidth;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(need * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(need * dpr);
    cv.style.width = W + 'px'; cv.style.height = need + 'px';

}
function strokePath(ctx, s, k) {
  const p = s.p; ctx.strokeStyle = s.c; ctx.lineWidth = s.w * k * 1.2; ctx.beginPath();
  if (p.length === 1) { ctx.arc(p[0][0] * k, p[0][1] * k, s.w * k * .6, 0, 7); ctx.fillStyle = s.c; ctx.fill(); return; }
  ctx.moveTo(p[0][0] * k, p[0][1] * k);
  for (let i = 1; i < p.length - 1; i++) { const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2; ctx.quadraticCurveTo(p[i][0] * k, p[i][1] * k, mx * k, my * k); }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.lineCap = ctx.lineJoin = 'round';

}

}
function padFlush() {

  clearTimeout(P.timer); P.timer = null;
  const k = P.key, v = {text: P.text, strokes: P.strokes, at: Date.now()};
  pdfPut('pad:' + k, v).then(() => { if (P.key === k) padEl('padSave').textContent = '저장됨'; }).catch(e => toast('메모장을 저장하지 못했어요: ' + e.message));
}
async function padLoad() {
  padFlush();
  P.key = S.key; P.hist = [];
  const v = await pdfGet('pad:' + P.key).catch(() => null);
  if (P.key !== S.key) return;
  P.text = v?.text || ''; P.strokes = v?.strokes || [];
  padEl('padText').value = P.text; padEl('padSave').textContent = '';
  padSize();
}
function padMode(m) {
  P.mode = m;
  document.querySelectorAll('.padmode button').forEach(b => b.classList.toggle('on', b.dataset.pm === m));
  padEl('pad').classList.toggle('inking', m !== 'type');
  padEl('pad').classList.toggle('erasing', m === 'erase');
  if (m === 'type') padEl('padText').focus();
}
function padToggle(on = !document.body.classList.contains('padOn')) {
  document.body.classList.toggle('padOn', on);
  $('#padBtn').classList.toggle('on', on);

}
$('#padBtn').onclick = () => padToggle();
padEl('padClose').onclick = () => padToggle(false);

document.querySelector('.padink').addEventListener('click', e => {
  const c = e.target.closest('.pcol'), w = e.target.closest('.pw');
  if (c) { P.col = c.dataset.c; document.querySelectorAll('.pcol').forEach(x => x.classList.toggle('on', x === c)); if (P.mode !== 'pen') padMode('pen'); }
  if (w) { P.w = +w.dataset.w; document.querySelectorAll('.pw').forEach(x => x.classList.toggle('on', x === w)); if (P.mode !== 'pen') padMode('pen'); }
});

padEl('padUndo').onclick = () => { if (!P.hist.length) return toast('되돌릴 펜 글씨가 없어요.'); P.strokes = P.hist.pop(); padSize(); padSaveSoon(); };

// 펜·지우개: 손가락은 펜을 한 번이라도 쓴 뒤에는 화면 넘기기로 씀
padEl('padInk').addEventListener('pointerdown', e => {

  const eraseAt = q => {
    const R = 10 / k + 4, keep = P.strokes.filter(st => !st.p.some(([x, y]) => (x - q[0]) ** 2 + (y - q[1]) ** 2 < (R + st.w) ** 2));

/* ---------- 끌어다 놓기 (마우스·터치 공통) ---------- */
// ghostEl: 끌 때 따라다닐 요소(핀 모양 그대로), grab: 누른 곳과 핀 기준점의 차이(튀지 않게)
function startDrag(e, {ghostHtml, ghostEl, grab, onDrop, onClick, sourceEl}) {
  if (e.button > 0) return;
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, viewer = $('#viewer');
  let moved = false, ghost = null, target = null, lastY = sy, timer = null;
  const dx = grab ? grab.dx : 0, dy = grab ? grab.dy : 0;
  const autoScroll = () => {
    clearInterval(timer);
    const r = viewer.getBoundingClientRect(); let d = 0;
    if (lastY < r.top + 60) d = -16; else if (lastY > r.bottom - 60) d = 16;
    if (d) timer = setInterval(() => { viewer.scrollTop += d; }, 16);
  };
  const move = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
    if (!moved) {
      moved = true;
      if (ghostEl) { ghost = ghostEl; ghost.classList.add('floating'); }
      else { ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.innerHTML = ghostHtml; }
      document.body.appendChild(ghost); sourceEl?.classList.add('dragging');
    }
