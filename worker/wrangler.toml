# 임용 준비 저장소 문지기 — 올리기: (이 폴더에서) npx wrangler deploy
name = "imyong-store"
main = "worker.js"
compatibility_date = "2026-11-01"
preview_urls = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "imyong"

[vars]
