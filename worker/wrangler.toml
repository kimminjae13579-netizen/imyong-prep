#   SESSION_SECRET (로그인 표 서명), ADMIN_EMAILS (관리자 이메일, 쉼표로 여러 명)
CLIENT_ID = "379559393104-nsj44mhabqogcpv43rnrlkqor4c43jln.apps.googleusercontent.com"
