<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임용 준비</title>
<!-- 홈 화면에 추가하면 앱처럼 전체화면으로 열림 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23433A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="임용 준비">
<link rel="apple-touch-icon" href="imyong-icon-192.png">
<link rel="icon" href="imyong-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  /* 모눈 노트와 칠판 */
  --paper:#F2F5F3; --grid:#DFE7E3; --card:#FCFDFC; --ink:#1E2B27; --sub:#5B6A64; --line:#D3DDD8;
  --board:#23433A; --board-2:#2E5549; --navy:#2B4170; --navy-2:#364F84; --chalk:#F4F7F2;
  --hl:#F2DF4A; --hl-soft:#FBF4BF; --warn:#C9412F; --ok:#2F7A4B;
  --bg:var(--paper);
  --accent:var(--board); --accent-soft:#E2ECE7;
  --demo:var(--board); --demo-soft:#E2ECE7; --intv:var(--navy); --intv-soft:#E4E9F3;
  --memo:#F2DF4A; --bm:#E07B2A; --rec:#C9412F;
  --serif:"Hahmlet","Nanum Myeongjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.hidden{display:none!important}
body[data-sec=intv]{--accent:var(--intv);--accent-soft:var(--intv-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #C4D0CA;background:var(--card);border-radius:8px;padding:9px 16px;font-size:15px;font-weight:500;white-space:nowrap;min-height:44px;text-decoration:none}
.btn:hover{background:#EAF0ED;border-color:#AFC0B8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{color:var(--warn)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(35,67,58,.08)}
.btn.small{padding:5px 12px;font-size:14px;min-height:36px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--hl-soft);border-color:#D9C437;color:var(--ink);font-weight:700}
.iconbtn{border:none;background:none;color:var(--sub);border-radius:8px;min-width:40px;min-height:40px;font-size:17px}
.iconbtn:hover{background:rgba(35,67,58,.08);color:var(--ink)}

/* 상단 바: 칠판 */
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--chalk);border-bottom:4px solid rgba(0,0,0,.18)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 20px;min-height:60px}
.top .crumb{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden;font-family:var(--serif);font-weight:700;font-size:20px}
@media (max-width:420px){.top .crumb a[data-parent], .top .crumb a[data-parent] + .sep{display:none}}
.top .crumb a{color:rgba(244,247,242,.72);text-decoration:none;font-weight:500;font-size:16px;padding:4px 8px;border-radius:6px}
.top .crumb a:hover{background:rgba(255,255,255,.1);color:#fff}
.top .crumb .sep{color:rgba(244,247,242,.4);font-weight:400}
.top .crumb .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:var(--chalk)}
.top .btn:hover{background:rgba(255,255,255,.16)}
.top .iconbtn{color:rgba(244,247,242,.8)}
.top .iconbtn:hover{background:rgba(255,255,255,.12);color:#fff}
#editBtn.on{background:var(--hl);border-color:var(--hl);color:var(--ink)}
body.editing .top{border-bottom-color:var(--hl)}

main{max-width:1080px;margin:0 auto;padding:36px 20px 80px}
.h1{font-family:var(--serif);font-size:34px;font-weight:700;margin:0 0 6px;letter-spacing:-.5px;line-height:1.25}
.lead{color:var(--sub);margin:0 0 22px}

/* 첫 화면: 아이콘 타일 (태블릿 홈 화면처럼) — 윗줄 수업실연은 연한 초록, 아랫줄 면접은 연한 파랑 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:4px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:clamp(140px,22vh,210px);padding:20px 10px;border-radius:16px;text-decoration:none;text-align:center;background:#E1F5EE;color:#085041;border:1px solid #BFE6D6;transition:transform .12s,border-color .12s,background .12s}
.tile.intv{background:#E6F1FB;color:#0C447C;border-color:#C6DDF3}
.tile .tic{display:flex;width:clamp(44px,5.5vw,60px);height:clamp(44px,5.5vw,60px)}
.tile .tic svg{width:100%;height:100%}
.tile .tnm{font-family:var(--serif);font-weight:700;font-size:clamp(17px,2.2vw,24px);line-height:1.3;word-break:keep-all}
.tile:hover{transform:translateY(-2px);border-color:#5DCAA5;background:#D3EFE4}
.tile.intv:hover{border-color:#85B7EB;background:#D9E9F8}
.tile:focus-visible{outline:3px solid currentColor;outline-offset:3px}
@media (max-width:520px){.tiles{gap:8px}.tile{min-height:110px;gap:8px;padding:14px 4px;border-radius:12px}.tile .tnm{font-size:15px}}
@media (prefers-reduced-motion:reduce){.tile:hover{transform:none}}

/* 목록 머리 */
.lhead{display:flex;align-items:center;gap:8px;margin:0 0 20px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.lhead .h1{flex:1;margin:0}
.empty{text-align:center;color:var(--sub);padding:56px 20px;background:var(--card);border:2px dashed #BCCBC4;border-radius:10px}
.empty .ic{font-size:36px;display:block;margin-bottom:6px}

/* 카드 목록: 종이 한 장 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 #C9D5CF}
.doc{padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;border-top:5px solid var(--accent)}
.doc:hover{border-color:var(--accent)}
.doc .nm{font-weight:700;padding-right:28px;font-size:17px}
.doc .mt{font-size:13px;color:var(--sub)}
.doc .del{position:absolute;top:8px;right:6px}

/* 녹화 기록 카드 */
.rec{cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.rec:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rec .th{aspect-ratio:16/9;background:var(--board);position:relative;display:flex;align-items:center;justify-content:center;color:rgba(244,247,242,.5);font-size:28px}
body[data-sec=intv] .rec .th{background:var(--navy)}
.rec .th img{width:100%;height:100%;object-fit:cover;display:block}
.rec .dur{position:absolute;right:8px;bottom:8px;background:var(--hl);color:var(--ink);font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.rec .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.rec .ti{font-weight:700}
.rec .ti.no{color:var(--sub);font-weight:500}
.rec .mt{font-size:13px;color:var(--sub)}
.rec .ln{font-size:13.5px;display:flex;gap:6px;line-height:1.45}
.rec .ln b{flex:none}
.rec .ln span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}

/* 만능틀 / 유형 목록 */
.row{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;border-left:5px solid var(--accent)}
.row:hover{box-shadow:0 0 0 1px var(--accent)}
.row .ic{font-size:24px}
.row .bd{flex:1;min-width:0}
.row .nm{font-family:var(--serif);font-weight:700;font-size:20px}
.row .mt{font-size:14px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:10px}
/* 연습 폴더 */
.folds{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 18px;padding-top:14px}
/* 폴더 모양: 뒤쪽 탭 + 노란 앞판, 이름은 앞판 위에 */
.fold{position:relative;aspect-ratio:5/4;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:20px 14px 14px;text-align:center;color:var(--ink);background:linear-gradient(#FFEDAE,#FADC85);border-radius:4px 12px 12px 12px;box-shadow:0 2px 0 #E5C463,0 8px 16px rgba(60,45,0,.08);transition:transform .12s,box-shadow .12s}
.fold::before{content:"";position:absolute;left:0;top:-13px;width:44%;height:17px;background:#F4D274;border-radius:9px 12px 0 0}
.fold::after{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:rgba(255,255,255,.35);border-radius:4px 12px 0 0}
.fold:hover{transform:translateY(-2px);box-shadow:0 2px 0 #E5C463,0 12px 22px rgba(60,45,0,.14)}
.fold:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.fold .nm{font-family:var(--serif);font-weight:700;font-size:clamp(17px,2vw,21px);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.fold .fed{position:absolute;right:4px;top:4px;color:#8A7A4A;min-width:36px;min-height:36px;z-index:1}
.fold .fed:hover{background:rgba(255,255,255,.45);color:#4A3500}
@media (max-width:520px){.folds{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px}.fold{padding:18px 8px 10px}}
@media (prefers-reduced-motion:reduce){.fold:hover{transform:none}}

/* 오버레이 (전체 화면) */
.ov{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column}
.ov .bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:2px solid var(--accent);min-height:60px;flex-wrap:wrap}
.ov .bar .t{font-family:var(--serif);font-weight:700;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .body{flex:1;min-height:0;overflow:auto}

/* PDF 보기 */
.pv .body{display:flex;overflow:hidden}
.pvside{width:290px;flex:none;background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:6px 0 30px}
.pvside h4{margin:16px 16px 6px;font-size:14px;color:var(--ink);font-family:var(--serif);display:flex;align-items:center;gap:6px}
.pvside .none{font-size:13px;color:#8D9A94;padding:2px 16px}
.bmi{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 16px;cursor:pointer}
.bmi:hover{background:#EEF3F0}
.bmi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bmi .p{font-size:12px;color:var(--sub)}
.bmi .iconbtn{min-width:30px;min-height:30px;font-size:14px;opacity:0}
.bmi:hover .iconbtn{opacity:1}
@media (pointer:coarse){.bmi .iconbtn{opacity:1}}
.mmi{margin:6px 12px;border:1px solid #E6D46A;background:#FFFBE3;border-radius:6px;padding:8px 10px}
.mmi.sel{box-shadow:0 0 0 2px #D9B92A}
.mmi .hd{display:flex;align-items:center;gap:6px;font-size:12px;color:#7A6400;font-weight:700;cursor:pointer}
.mmi .hd .sp{flex:1}
.mmi .no{width:20px;height:20px;border-radius:50%;background:var(--memo);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#4D3E00}
.mmi textarea{width:100%;border:none;background:transparent;resize:none;padding:4px 0 0;line-height:1.55;font-size:14.5px;min-height:44px;outline:none}
.pvview{flex:1;overflow:auto;background-color:#E1E8E4;background-image:linear-gradient(#D3DCD7 1px,transparent 1px),linear-gradient(90deg,#D3DCD7 1px,transparent 1px);background-size:22px 22px;position:relative}
.pvpages{padding:20px 12px 60px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pg{position:relative;background:#fff;box-shadow:0 1px 2px rgba(20,40,30,.18),0 6px 18px rgba(20,40,30,.12)}
.pg canvas,.pg img{display:block;width:100%;height:100%}
.pg .no{position:absolute;bottom:-20px;right:0;font-size:12px;color:var(--sub)}
.pv.memoing .pg{cursor:crosshair}
.mpin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--memo);border:2px solid #C9A81E;color:#4D3E00;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.mpin.sel{outline:3px solid #C9A81E;outline-offset:2px}
.ribbon{position:absolute;top:-4px;right:20px;width:24px;height:38px;background:var(--bm);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);z-index:3;box-shadow:0 2px 4px rgba(0,0,0,.2)}
#pvBm.on{background:#FCEBDD;border-color:var(--bm);color:#A84F12}
.pvextra{width:340px;flex:none;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:18px}
.pgnum{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums}
.pgnum input{width:56px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:7px}
@media (max-width:900px){
  .pvside{position:absolute;left:0;top:0;bottom:0;z-index:5;box-shadow:8px 0 24px rgba(0,0,0,.15);display:none}
  .pv.side .pvside{display:block}
  .pvextra{display:none}
  .pv.extra .pvextra{display:block;position:absolute;right:0;top:0;bottom:0;z-index:5;width:min(360px,90vw)}
}

/* 신경 쓸 점: 실제 순서가 있는 목록 */
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.pts li{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:11px 4px;line-height:1.6}
.pts li .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pts li span{white-space:pre-wrap}

/* 폼 */
.form{display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl > label{font-weight:700;font-size:14px;color:#33433D}
.fl input[type=text],.fl textarea,.fl select{width:100%;border:1px solid #C4D0CA;border-radius:7px;padding:10px 12px;background:#fff;line-height:1.6}
.fl textarea{resize:vertical;min-height:90px}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.fl .hint{font-size:13px;color:var(--sub)}
.fl.good label{color:var(--ok)} .fl.fix label{color:#B4501E}
.fl.good textarea{border-left:4px solid #5DAE7C} .fl.fix textarea{border-left:4px solid #E89A5A}
.filepick{display:flex;align-items:center;gap:10px;border:2px dashed #BCCBC4;border-radius:8px;padding:10px 12px;background:#F7FAF8}
.filepick .fn{flex:1;min-width:0;color:var(--sub);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(18,34,28,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal .box{background:var(--card);border-radius:12px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(10,25,20,.3);overflow:hidden}
.modal .mh{padding:16px 20px;font-family:var(--serif);font-weight:700;font-size:19px;border-bottom:2px solid var(--accent)}
.modal .mb{padding:18px 20px;overflow:auto}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#F5F8F6}
.modal .mf .danger{margin-right:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;z-index:90;font-size:15px;border-left:6px solid var(--hl)}

/* 녹화 */
.recv .body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#17291F;padding:20px}
.recv video{max-width:100%;max-height:calc(100vh - 220px);border-radius:10px;background:#000;transform:scaleX(-1)}
.recv video.rear{transform:none}
.recv .rctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:min(560px,100%)}
.recv .camsw{justify-self:start;white-space:nowrap;border:1.5px solid rgba(244,247,242,.5);background:rgba(255,255,255,.08);color:var(--chalk);border-radius:999px;padding:10px 18px;font-size:15px;font-weight:700;min-height:48px}
.recv .camsw:hover{background:rgba(255,255,255,.16)}
.recv.on .camsw{opacity:.4}
.recv .clock{font-size:44px;font-weight:700;color:var(--chalk);font-variant-numeric:tabular-nums;letter-spacing:1px;display:flex;align-items:center;gap:12px}
.recv .clock .dot{width:14px;height:14px;border-radius:50%;background:var(--rec);opacity:0}
.recv.on .clock .dot{opacity:1;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.recbtn{width:78px;height:78px;border-radius:50%;border:4px solid var(--chalk);background:transparent;display:flex;align-items:center;justify-content:center}
.recbtn i{display:block;width:56px;height:56px;border-radius:50%;background:var(--rec);transition:.2s}
.recv.on .recbtn i{width:30px;height:30px;border-radius:6px}
.recv .msg{color:#C5D3CC;font-size:15px;text-align:center}

/* 기록 편집 */
.ed .body{padding:20px}
.ed .wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
@media (max-width:900px){.ed .wrap{grid-template-columns:1fr}}
.vbox{background:#17291F;border-radius:10px;overflow:hidden}
.vbox video{display:block;width:100%;max-height:60vh;background:#000}
.trim{padding:14px 16px 16px;color:#DCE6E1}
.track{position:relative;height:46px;background:#2B4238;border-radius:7px;cursor:pointer;touch-action:none;user-select:none}
.track .sel{position:absolute;top:0;bottom:0;background:rgba(242,223,74,.28);border-top:3px solid var(--hl);border-bottom:3px solid var(--hl)}
.track .h{position:absolute;top:-4px;bottom:-4px;width:16px;margin-left:-8px;background:var(--hl);border-radius:5px;cursor:ew-resize;touch-action:none}
.track .h::after{content:"";position:absolute;left:5px;top:16px;bottom:16px;width:6px;border-left:2px solid #4D4300;border-right:2px solid #4D4300;opacity:.7}
.track .ph{position:absolute;top:-6px;bottom:-6px;width:2px;background:#fff;pointer-events:none}
.trim .tr{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;font-size:14px}
.trim .tr .sp{flex:1}
.trim .btn{background:#2B4238;border-color:#3D574C;color:#E6EEEA}
.trim .btn:hover{background:#355045}
.trim .len{font-weight:800;color:#fff;font-size:16px;font-variant-numeric:tabular-nums}
.trim .tm{font-variant-numeric:tabular-nums;color:#A9BBB3}
.side .card{padding:20px}
.edmore{max-width:1180px;margin:20px auto 0;display:flex;flex-direction:column;gap:20px}
.edsec{padding:18px 20px}
.edh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.edh h3{margin:0;font-family:var(--serif);font-size:19px}
.edh .sp{flex:1}
.edcnt{font-size:14px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.pics{display:flex;flex-wrap:wrap;gap:12px}
.pic{position:relative;margin:0;width:180px;height:130px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.pic img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.picdel{position:absolute;top:6px;right:6px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(30,43,39,.75);color:#fff;font-size:14px;cursor:pointer}
.picnone{margin:0;color:var(--sub)}
.piczoom{position:fixed;inset:0;z-index:80;background:rgba(15,25,20,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.piczoom img{max-width:96%;max-height:86vh;border-radius:6px;background:#fff}
.piczoom p{color:rgba(255,255,255,.75);margin:12px 0 0;font-size:14px}
.edck{overflow-x:auto}
.vbox.aud video{height:58px;max-height:none}

/* 받아쓴 글 */
.scr textarea{width:100%;min-height:220px;border:1px solid #C4D0CA;border-radius:7px;padding:12px 14px;background:#fff;line-height:1.75;resize:vertical}
.scr textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.segs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:#fff;padding:14px 16px;line-height:1.75}
.segs.plain{grid-template-columns:minmax(0,1fr)}
.segs p{margin:0;white-space:pre-wrap;max-width:72ch}
.segs .who{font-size:13px;color:var(--sub);font-weight:700;margin-right:8px}
.segt{display:inline-flex;align-items:center;border:none;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 10px;height:26px;margin-top:2px;white-space:nowrap}
button.segt{cursor:pointer}
button.segt:hover{background:var(--accent);color:#fff}
/* 문제와 답변 나눠 보기 */
.iqs{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.iqtop{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:12px}
.iqtop h4{margin:0;font-family:var(--serif);font-size:17px}
.iqtop span{font-size:13px;color:var(--sub)}
.iq{background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:12px 16px 12px;margin-bottom:12px}
.iqh{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.iqh b{font-size:16px;color:var(--accent)}
.iqh > span{font-size:13px;color:var(--sub);background:#EEF2F0;border-radius:999px;padding:1px 10px;font-variant-numeric:tabular-nums}
.iq .lab{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:5px;padding:0 7px;margin-right:7px;vertical-align:1px;line-height:1.7}
.iqq{margin-top:9px;background:var(--accent-soft);border-radius:7px;padding:8px 12px}
.iqq p{margin:0;line-height:1.65;max-width:72ch}
.iqq .lab{float:left;margin-top:3px}
.iqg{margin-top:10px}
.iqg h5{margin:0 0 4px;font-size:15px;line-height:1.6}
.iqg ol{margin:0;padding-left:1.6em;line-height:1.65;max-width:76ch}
.iqg li{margin:2px 0}
.iqg li::marker{font-weight:700;color:var(--accent)}
.iqfl{margin-top:10px;display:grid;gap:4px;line-height:1.65;max-width:76ch}
.iqfl p{margin:0}
.iqfl .lab{background:#7A8A84}
.iqtop .sp{flex:1}
/* 문제와 답변 나눠 보기: 받아쓴 글·오른쪽 칸 아래에서 시작 (위 줄이 두 칸의 맨 아래와 맞음) */
.sumwrap:empty{display:none}
.sumwrap .iqs{margin-top:0}
/* 답변과 답변 사이: 위쪽 긴 줄과 같은 폭의 점선 */
.iqitem > .iq,.iqitem > .iqrow{margin-bottom:0}
.iqitem + .iqitem{border-top:1px dashed #B9C6C0;margin-top:16px;padding-top:16px}

/* 답변 한 줄 = 왼쪽 답변 + 오른쪽 평가 (위 두 칸과 같은 폭) */
.iqrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start;margin-bottom:12px}
.iqrow .iq{margin-bottom:0}
@media (max-width:900px){.iqrow{grid-template-columns:1fr;gap:8px}}
/* 평가: 답변 카드와 같은 구성, 파란 부분만 노랑 */
.iq.evc{--accent:#C99A2E;--accent-soft:#FFF3C9;background:#FFFEF7}
.iq.evc .iqh b{color:#8A6400}
.evnone{min-height:1px}
.evstack{display:flex;flex-direction:column;gap:10px}
/* 평가 글: 번호 없이 글만 */
.evtext{margin-top:8px;line-height:1.65;max-width:76ch}
.evtext p{margin:2px 0;white-space:pre-wrap}

.evw textarea.iqevt{display:block;width:100%;margin-top:10px;border:1px solid #E5C463;border-radius:7px;background:#fff;padding:9px 11px;line-height:1.65;font-size:15px;resize:vertical;min-height:90px}
.evw textarea.iqevt:focus{outline:3px solid #FBF1C9;border-color:#C99A2E}
/* 평가 줄: 보기 · 이름 고르기 · 쓰는 중 */
.evbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FFFBEA;border:1px solid #EFDFA6;border-left:5px solid #E5C463;border-radius:8px;padding:10px 12px;margin:0 0 12px;scroll-margin-top:12px}
.evbar .evq{font-size:14px;font-weight:700;color:#5A4100}
.evbar .sp{flex:1}
.evbar .evdone{min-width:84px}
.evstart{background:#FFF1BF;border-color:#E5C463;color:#5A4100}
.evstart:hover{background:#F9E39A;border-color:#D9B34A}
.evf{display:inline-flex;align-items:center;gap:4px;border:1px solid #E5C463;background:#fff;color:#5A4100;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700;min-height:38px}
.evf:hover{background:#FFF1BF}
.evf.has{background:#FFF7D6}
.evf i{font-style:normal;color:#2F7A4B;font-weight:800}
.evf.on{background:#F4D274;border-color:#C99A2E;color:var(--ink);box-shadow:0 0 0 2px #F4D274}
.evtag{display:inline-block;font-size:13px;font-weight:700;color:#5A4100;background:#F4D274;border-radius:5px;padding:2px 9px}
/* 받아쓴 글 칸은 오른쪽 칸 아래 끝까지 늘어남 (글만 있는 기록) */
/* 면접 기록 화면(uni): 맨 위 제목 + 오른쪽 걸린 시간 / 왼쪽 클로바노트 글·문제 사진 / 오른쪽 영상·좋은 점·고칠 점 / 아래 나눠 보기·평가 */
.ed.uni .edtop{max-width:1180px;margin:0 auto 18px;display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.edtitle{flex:1 1 320px;min-width:0;font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);border:none;border-bottom:2px solid var(--line);background:transparent;padding:6px 2px;border-radius:0}
.edtitle::placeholder{color:#8A9A93}
.edtitle:focus{outline:none;border-bottom-color:var(--accent)}
.eddur{display:flex;align-items:baseline;gap:10px;white-space:nowrap;border-bottom:2px solid var(--accent);padding:0 2px 8px}
.eddur span{font-size:13px;color:var(--sub);font-weight:700}
.eddur b{font-family:var(--serif);font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.eddur input{width:96px;border:1px solid #C4D0CA;border-radius:7px;padding:6px 10px;font-size:18px;text-align:center;background:#fff;font-variant-numeric:tabular-nums}
.eddur input:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.ed.uni .lcol{display:flex;flex-direction:column;gap:20px;min-width:0;align-self:stretch}
.ed.uni .lcol > .scr{flex:1 1 auto;display:flex;flex-direction:column}
.ed.uni .lcol > .scr #scrBox{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.ed.uni .lcol > .scr .segs{flex:1 1 0;min-height:240px;max-height:none}
.ed.uni .lcol > .scr #scrBox > textarea{flex:1 1 auto}
.ed.uni .side{display:flex;flex-direction:column;gap:20px;min-width:0}
.vidnone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:210px;border:2px dashed #BCCBC4;border-radius:10px;background:#F7FAF8;color:var(--sub);font-size:14px}
.vidnone .ic{font-size:42px;line-height:1}
.vidnone b{color:var(--ink);font-size:17px}
.vidnone:hover{border-color:var(--accent);background:#EEF2F8}
.vidsec .vbox video{max-height:42vh}
@media (max-width:900px){.ed.uni .lcol > .scr .segs{flex:none;max-height:460px}}
/* 면접: 문제 사진 칸 높이 = 영상 칸 높이 (스크립트로 맞춤), 받아쓴 글 칸 = 영상 + 문제 사진 높이 */
.ed.uni .lcol > .scr .segs{min-height:160px}
.ed.uni .side{align-self:start}
.ed.uni .side > .picsec{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ed.uni .side > .picsec .pics{flex:1 1 0;min-height:0;overflow:auto;align-content:flex-start}
/* 면접: 문제 사진 미리보기를 칸 폭에 맞춰 크게 (사진 전체가 보이게) */
.ed.uni .picsec .pics{display:grid;grid-template-columns:1fr;gap:12px}
.ed.uni .picsec .pic{width:100%;height:auto;aspect-ratio:4/3;background:#F3F6F4}
.ed.uni .picsec .pic img{object-fit:contain}

/* 문제 사진 크게 보기: 화면 가득 (브라우저 전체화면은 ⛶ 단추로만) */
.piczoom{background:rgba(14,22,18,.94)}
.piczoom img{max-width:96vw;max-height:88vh}
.pznav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:34px;line-height:1;cursor:pointer}
.pznav:hover{background:rgba(255,255,255,.32)}
.pznav.prev{left:16px}
.pznav.next{right:16px}

.iqtop .btn{min-height:34px}
/* 고치기: 보는 화면과 같은 모양, 글자 칸만 연하게 표시 */
.iq.qed .ce{outline:none;border-radius:3px;cursor:text;transition:background .1s;-webkit-user-select:text;user-select:text}
.iq.qed .ce:hover{background:rgba(242,223,74,.2)}
.iq.qed .ce:focus{background:#FFF7CC;box-shadow:0 0 0 2px #F2DF4A}
.iq.qed .ce:empty{display:inline-block;min-width:3em;min-height:1.4em;vertical-align:bottom;background:rgba(242,223,74,.2)}
.iq.qed .ce:empty::before{content:attr(data-ph);color:#A9B5B0;font-weight:400}
/* 고치기 중에만 보이는 더하기·지우기 */
.iq.qed .qsp{flex:1}
.qx{border:none;background:none;color:#9AA7A1;border-radius:6px;min-width:30px;min-height:30px;font-size:14px;cursor:pointer;padding:0 6px}
.qx:hover{background:#FBE4E0;color:var(--warn)}
.iq.qed .qg{position:relative;padding-right:30px}
.iq.qed .qgx{position:absolute;right:-6px;top:0}
.qadd{margin-top:10px;border:1px dashed #B9C6C0;background:none;color:var(--sub);border-radius:7px;padding:4px 12px;font-size:13.5px;font-weight:700;min-height:32px;cursor:pointer}
.qadd:hover{border-color:var(--accent);color:var(--accent)}
.qaddu{margin-top:14px}

/* 유형정리 */
.tview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
@media (max-width:900px){.tview{grid-template-columns:1fr}}
.tview .card{padding:20px}
/* 유형 안: 넓게, 여백 넉넉히, 답변 방향은 2단 */
.tvbody{padding:36px 48px 56px}
.tview1{max-width:1400px;margin:0 auto}
.tview1 .card{padding:36px 48px 44px}
.tview1 .tdesc{column-count:2;column-gap:56px;column-rule:1px solid var(--line)}
@media (max-width:1000px){.tvbody{padding:20px 16px 40px}.tview1 .card{padding:22px 20px}.tview1 .tdesc{column-count:1}}
.tview h3{margin:0 0 10px;font-size:18px;font-family:var(--serif)}
.tdesc{white-space:pre-wrap;color:#34433D;line-height:1.75}
.tdesc mark{font:inherit;letter-spacing:inherit;background:color-mix(in srgb,var(--hl) 75%,transparent);color:inherit;border-radius:3px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.dh{display:flex;align-items:center;gap:6px;white-space:nowrap}
.dtip{font-size:13px;color:var(--sub);margin:-4px 0 10px}
.dcard.editing .tdesc{outline:2px dashed var(--line);outline-offset:6px;border-radius:6px;background:#fff;cursor:text;min-height:4em}
.dcard.pen .tdesc{cursor:text}
.dcard:not(.editing) .tdesc mark{cursor:pointer}
.tdesc .sq{font-size:1.12em;font-weight:800;color:var(--ink)}
.tdesc:empty::before{content:attr(data-ph);color:var(--sub)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff;text-align:left;line-height:1.5;min-height:44px}
.qi:hover{border-color:var(--accent)}
.qi.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.qi .n{flex:none;font-weight:800;color:var(--accent);min-width:20px;font-variant-numeric:tabular-nums}
.qi .c{margin-left:auto;font-size:12px;color:var(--sub);white-space:nowrap}
.qnow{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.6;padding:16px 18px;background:var(--accent);color:var(--chalk);border-radius:8px;margin-bottom:14px;white-space:pre-wrap}
.atimer{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.atimer b{font-size:22px;font-variant-numeric:tabular-nums;min-width:64px}
textarea.ans{width:100%;min-height:220px;border:1px solid #C4D0CA;border-radius:8px;padding:14px 16px;font-size:16.5px;line-height:1.8;resize:vertical;background-color:#fff;background-image:linear-gradient(transparent calc(1.8em - 1px),#E3EAE6 1px);background-size:100% 1.8em;background-attachment:local;background-position:0 14px}
textarea.ans:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer;padding:8px;border-radius:6px}
.checks label:hover{background:#EEF3F0}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.hist{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.hi{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#FAFCFB}
.hi .hd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:6px}
.hi .hd .sp{flex:1}
.hi .q{font-weight:700;font-size:14.5px;margin-bottom:4px}
.hi .a{white-space:pre-wrap;line-height:1.65;font-size:15px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#E8EEEB;color:var(--sub)}
.chip.ok{background:#E2F2E7;color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px}
.tabs button{border:none;background:none;padding:8px 12px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hl)}
/* 기출 문제지 + 영역 설명 */
.sheets .body{background-color:#E1E8E4;background-image:linear-gradient(#D3DCD7 1px,transparent 1px),linear-gradient(90deg,#D3DCD7 1px,transparent 1px);background-size:22px 22px}
.shwrap{max-width:920px;margin:0 auto;padding:20px 20px 40px}
.shpages{display:flex;flex-direction:column;gap:28px;min-width:0;overflow-x:hidden;padding-bottom:4px}
.shpage{margin:0}
.shpage figcaption{font-family:var(--serif);font-weight:700;font-size:17px;margin:0 0 8px}
.shimg{position:relative;background:#fff;box-shadow:0 1px 2px rgba(20,40,30,.18),0 8px 22px rgba(20,40,30,.12)}
.shimg img{display:block;width:100%;height:auto}
.hit{position:absolute;padding:0;border:2px solid #D9B92A;background:rgba(242,223,74,.22);border-radius:4px;cursor:pointer;mix-blend-mode:multiply}
.hit span{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:8px;background:var(--hl);color:var(--ink);font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;mix-blend-mode:normal}
.hit.lb span{left:50%;top:100%;transform:translateX(-50%);margin:6px 0 0}
.hit:hover{background:rgba(242,223,74,.4)}
.hit.on{background:rgba(242,223,74,.5);border-color:var(--board);box-shadow:0 0 0 3px var(--board)}
.hit.on span{background:var(--board);color:#fff}
/* 노란 칸을 누르면 문제지 빈 곳에 뜨는 한 줄 안내 */
.shtip{position:absolute;z-index:2;background:#FFFBE0;border:2px solid var(--board);border-radius:10px;padding:10px 14px;box-shadow:0 6px 16px rgba(20,40,30,.2);font-size:clamp(13px,1.9vw,17px);line-height:1.55;font-weight:700;color:var(--ink);max-width:56%;animation:tipin .15s ease-out}
.shtip ul{margin:4px 0 0;padding-left:1.1em;font-weight:500}
.shtip li+li{margin-top:2px}
.shtip::before{content:"";position:absolute;width:12px;height:12px;background:#FFFBE0;border:2px solid var(--board);transform:rotate(45deg)}
.shtip.r::before{left:-8px;top:calc(50% - 6px);border-top:none;border-right:none}
.shtip.r{max-width:42%}
.shtip.d::before{top:-8px;left:22px;border-bottom:none;border-right:none}
.shtip.d.end::before{left:auto;right:22px}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.shgo{display:block;width:100%;margin-top:24px;min-height:56px;font-size:17px}

/* 칠판 화면 */
.ov.chalkov{flex-direction:row;background:#3B2B1D}
.bdside{flex:0 0 25%;min-width:250px;max-width:400px;background:var(--paper);display:flex;flex-direction:column;border-right:6px solid #2A1E14;overflow:hidden}
.bdtop{padding:6px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.bdnotes{list-style:none;margin:0;padding:6px 18px 24px;overflow:auto;flex:1}
.bdnotes li{padding:16px 0;border-bottom:1px solid var(--line);line-height:1.65;font-size:17px}
.bdnotes li:last-child{border-bottom:none}
.bdnotes b{display:block;font-family:var(--serif);font-size:18px;color:var(--board);margin-bottom:4px}
.bdwall{flex:1;min-width:0;min-height:0;padding:14px 18px 0;display:flex;background:#3B2B1D;background-image:linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);background-size:9px 100%}
.bdframe{flex:1;display:flex;flex-direction:column;border:14px solid #8A6340;border-bottom:none;border-radius:6px 6px 0 0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.4);background:
  radial-gradient(ellipse 60% 40% at 25% 30%,rgba(255,255,255,.07),transparent 70%),
  radial-gradient(ellipse 50% 35% at 75% 70%,rgba(255,255,255,.05),transparent 70%),
  radial-gradient(ellipse 30% 20% at 60% 15%,rgba(255,255,255,.04),transparent 70%),
  #2F4C41;min-height:0}
.bdboard{flex:1;position:relative;min-height:0}
/* 정리 판서: 분필 글씨 */

/* 체크리스트 점수 3·2·1 (3 잘했어요 · 2 보통 · 1 부족해요) */.mk-3.on{background:#2F7A4B;border-color:#2F7A4B;color:#fff}

.ckfold{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);border-left:5px solid #F4D274;background:#FFFBEA;border-radius:8px;padding:12px 14px;min-height:50px}

.avgtable th.fc{max-width:110px;font-size:12.5px;line-height:1.35;text-align:center;word-break:keep-all}

/* 자료실 보기: 형광펜 메모 + 메모장 (교과서 분석과 같은 모양) */
.pvwrap{flex:1;min-width:0;position:relative;display:flex}
.pvpal{position:absolute;right:16px;top:14px;z-index:6;background:#fff;border-radius:12px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(20,40,30,.18);padding:10px;display:flex;flex-direction:column;gap:8px;width:104px}
.pvpal .ph{font-size:13px;text-align:center;font-weight:700;font-family:var(--serif)}
.pvpal .tool{border:2px solid var(--line);background:#fff;border-radius:10px;padding:12px 4px 8px;font-size:36px;line-height:1;display:flex;flex-direction:column;align-items:center}
.pvpal .tool span{font-size:15px;font-weight:700;margin-top:6px;color:var(--ink)}
.pvpal .tool:hover{border-color:#2F9E44;background:#EBFBEE}
.pvpal .tool.on{outline:3px solid #2F9E44;background:#D3F9D8;border-color:#2F9E44}
/* 형광펜 색: 노랑·파랑·초록(기본)·보라 — --hc 칠, --hb 테두리, --hbg 글자 버튼 바탕, --ht 글자 */
.mhl,[data-hc=g]{--hc:rgba(64,192,87,.32);--hb:#2F9E44;--hbg:#EBFBEE;--ht:#2B8A3E}
[data-hc=y]{--hc:rgba(250,204,21,.42);--hb:#E0A800;--hbg:#FFF9DB;--ht:#8A5A00}
[data-hc=b]{--hc:rgba(77,171,247,.34);--hb:#1C7ED6;--hbg:#E7F5FF;--ht:#1864AB}
[data-hc=p]{--hc:rgba(132,94,247,.3);--hb:#7048E8;--hbg:#F3F0FF;--ht:#5F3DC4}
.mhl{position:absolute;z-index:2;pointer-events:none}
.mhl .hr{position:absolute;display:block;background:var(--hc);mix-blend-mode:multiply;border-radius:3px;pointer-events:auto;cursor:pointer}
.mhl.tmp .hr{pointer-events:none}
.mhl.sel .hr{box-shadow:0 0 0 2px var(--hb)}
.mhl .ulab{position:absolute;right:100%;transform:translateY(-28%);margin-right:6px;white-space:nowrap;pointer-events:auto;cursor:pointer;background:var(--hbg);color:var(--ht);border:2px solid var(--hb);border-radius:999px;padding:2px 11px;font-size:14px;font-weight:800;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.18)}
/* 내 노트 도구: 형광펜 색 고르기 · 색만 보기 */
.hcsec{display:flex;flex-direction:column;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:9px}
.hcl{font-size:12.5px;font-weight:700;color:var(--sub);text-align:center;line-height:1.3}
.hcols{display:grid;grid-template-columns:repeat(2,32px);gap:7px;justify-content:center}
.hcd{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #B9C6C0;padding:0;background:var(--hb)}
.hcd:hover{box-shadow:0 0 0 2px var(--hb)}
.hcd.on{box-shadow:0 0 0 3px var(--ink)}
.hcall{border:1px solid #C4D0CA;background:#fff;border-radius:999px;padding:3px 0;font-size:13px;font-weight:700;width:71px;min-height:32px}
.hcall.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mcolrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--sub);font-weight:700}
.mcolrow .hcd{width:30px;height:30px}
.pv.hling .pg{cursor:crosshair;touch-action:none}
.pv.hling .mhl:not(.tmp),.pv.hling .mpin{pointer-events:none;opacity:.55}
.pv.hling .mhl:not(.tmp) *{pointer-events:none}
.hlbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--ink);color:#fff;border-left:6px solid var(--hb,#40C057);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:15px;max-width:94vw}
.hlbar .hlcnt{opacity:.75;font-size:13px}
.hlbar .btn:not(.primary){background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.padhost .pad{display:none;width:420px;flex:none;flex-direction:column;min-height:0;background:var(--card);border-left:1px solid var(--line)}
.padhost.padon .pad{display:flex}

.padtext{position:absolute;inset:0;width:100%;height:100%;border:none;resize:none;overflow:hidden;font-size:calc(13px * var(--k,1));line-height:calc(16px * var(--k,1));padding:calc(8px * var(--k,1)) calc(16px * var(--k,1)) 0 calc(22px * var(--k,1));color:#1E2B27;background:transparent linear-gradient(to bottom,transparent calc(100% - 1px),#DCE6F0 0);background-size:100% calc(16px * var(--k,1));background-position:0 calc(8px * var(--k,1))}

<script>
'use strict';
/* =========================================================
   기본
   ========================================================= */
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem('imy:' + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem('imy:' + k, JSON.stringify(v)); gdSoon(); } catch (e) { toast('저장 공간이 부족해요'); } };
const fmt = s => { s = Math.max(0, Math.round(s || 0)); const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtK = s => { s = Math.round(s || 0); const m = s / 60 | 0, x = s % 60; return m ? `${m}분${x ? ' ' + x + '초' : ''}` : `${x}초`; };
const dstr = t => { const d = new Date(t); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; };
const dtstr = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }

// 큰 파일(영상·PDF)은 IndexedDB
let _db;
function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('imyong-prep', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('blobs');
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('blobs', mode); const req = fn(tx.objectStore('blobs'));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}
// 바꾸거나 지운 큰 파일은 구글 드라이브에도 올리도록 표시. 이 컴퓨터에 없으면 드라이브에서 받아 옴
const rawGet = id => idbDo('readonly', st => st.get(id)), rawPut = (id, b) => idbDo('readwrite', st => st.put(b, id)), rawDel = id => idbDo('readwrite', st => st.delete(id));
const blobPut = (id, b) => rawPut(id, b).then(r => { gdMark(id, 'put'); return r; });
const blobGet = id => rawGet(id).then(v => v !== undefined ? v : gdFetch(id));
const blobDel = id => rawDel(id).then(r => { gdMark(id, 'del'); return r; });
navigator.storage?.persist?.();

/* =========================================================
   구글 드라이브 연결 — 내 드라이브의 「임용 준비 앱」 폴더에 저장
   · 로그인: Google Identity Services 토큰, 범위 drive.file (이 앱이 만든 파일만 보고 씀)
   · 글 기록(localStorage 'imy:*')은 data.json 하나에, 큰 파일(PDF·영상·사진·메모장)은 하나씩
   · 합치기: 지난번 맞춘 상태(IndexedDB 'sync:base')와 비교. id 있는 목록은 항목끼리 합침
   · 큰 파일은 다른 컴퓨터에서 처음 열 때 받아 옴
   · 이 앱 전용 값은 'imysync:*' (드라이브로 안 올라감)
   ========================================================= */
const GOOGLE_CLIENT_ID = '379559393104-nsj44mhabqogcpv43rnrlkqor4c43jln.apps.googleusercontent.com';   // 여기에 넣어 두면 컴퓨터마다 붙여 넣지 않아도 됨 (공개돼도 괜찮은 값)
const SHARED_FOLDER_ID = '1EWEyMH9FD5w9t2WCHoGa9rdRH9fFRe51';   // 공용 폴더 (주소의 folders/ 뒤 글자) — 넣어 두면 컴퓨터마다 붙여 넣지 않아도 됨 (교과서 분석과 같은 값)
const sharedFolderId = () => SHARED_FOLDER_ID || localStorage.getItem('imysync:sharedfolder') || '';
const GD_TARGET_KEY = 'imysync:target';   // 마지막으로 맞춘 저장 장소 (own 또는 공용 폴더 id)
const GD = {
  // drive: 공용 폴더에 함께 저장하고 다른 사람이 만든 파일도 고칠 수 있게 (두 앱이 같은 로그인을 쓰니 같은 값이어야 함)
  scope: 'https://www.googleapis.com/auth/drive', folderName: '임용 준비 앱',
  get clientId() { return GOOGLE_CLIENT_ID || localStorage.getItem('imysync:client') || ''; },
  get on() { return localStorage.getItem('imysync:on') === '1'; },
  token: '', exp: 0, state: 'off', msg: '', base: undefined, busy: false, again: false, timer: 0, gsi: null, fetching: new Map()
};
try { const t = JSON.parse(localStorage.getItem('imysync:tok')); if (t && t.exp > Date.now() && t.s === GD.scope) { GD.token = t.t; GD.exp = t.exp; } /* 권한이 바뀌기 전 로그인은 다시 연결 */ } catch {}
const DAPI = 'https://www.googleapis.com/drive/v3/files', UAPI = 'https://www.googleapis.com/upload/drive/v3/files';
const gdReady = () => !!GD.token && Date.now() < GD.exp;
const gdLast = () => +localStorage.getItem('imysync:last') || 0;
const gdPend = () => { try { return JSON.parse(localStorage.getItem('imysync:pend')) || {}; } catch { return {}; } };
function gdMark(k, op) {
  k = String(k); if (k.startsWith('sync:')) return;
  const p = gdPend(); p[k] = {op, t: Date.now()}; localStorage.setItem('imysync:pend', JSON.stringify(p)); gdSoon();
}
// 고친 뒤 4초 동안 더 고치지 않으면 드라이브에 저장
function gdSoon() { if (!GD.on) return; clearTimeout(GD.timer); GD.timer = setTimeout(() => gdSync(), 4000); }
async function gdBase() { if (GD.base === undefined) GD.base = (await rawGet('sync:base').catch(() => null)) || null; return GD.base; }

function gsiLoad() {
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return GD.gsi ||= new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => res(); s.onerror = () => { GD.gsi = null; rej(new Error('구글 로그인 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')); };
    document.head.appendChild(s);
  });
}

function modal(title, html, buttons, onOpen) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal"><div class="box"><div class="mh">${title}</div><div class="mb">${html}</div>
    <div class="mf">${buttons.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}" data-i="${i}">${b.label}</button>`).join('')}</div></div></div>`;
  const m = root.firstChild, box = $('.box', m);
  m.onclick = e => { if (e.target === m) closeModal(); };
  $$('.mf button', box).forEach(b => b.onclick = async () => { const d = buttons[+b.dataset.i]; if (d.onClick && await d.onClick(box) === false) return; closeModal(); });
  onOpen && onOpen(box);
  return box;
}
const closeModal = () => { $('#modalRoot').innerHTML = ''; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });

function route() {
  const key = location.hash.replace(/^#\/?/, '').replace(/^home$/, '');
  let r = ROUTES[key];
  // 연습 폴더: #demo/practice/<폴더id>, #intv/practice/<폴더id>
  const fm = !r && key.match(/^(demo|intv)\/practice\/([\w-]+)$/);
  if (fm) {
    const k = fm[1], f = D.folders(k).find(x => x.id === fm[2]);
    if (f) r = {title: f.name, sec: k, parent: k, up: {href: `#${k}/practice`, title: KIND[k].name + ' 연습'}, render: () => renderFolder(k, f.id)};
    else { history.replaceState(null, '', `#${k}/practice`); r = ROUTES[`${k}/practice`]; }
  }
  r = r || ROUTES[''];
  document.body.dataset.sec = r.sec || '';
  const crumbs = [`<a href="#home">🏠</a>`];
  if (r.parent) crumbs.push(`<span class="sep">›</span><a href="#home" data-parent="${r.parent}">${ROUTES[r.parent].title}</a>`);   // 수업실연·면접은 첫 화면 칸반 보드의 열
  if (r.up) crumbs.push(`<span class="sep">›</span><a href="${r.up.href}">${r.up.title}</a>`);   // 좁은 화면에서도 폴더 목록으로 돌아갈 수 있게
  if (key) crumbs.push(`<span class="sep">›</span><span class="cur">${esc(r.title)}</span>`);
  else crumbs.push(`<span class="cur">임용 준비</span>`);

  r.render();
}

function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null); i.click();

}
async function pdfPages(blob) {
  const doc = await pdfjsLib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
  const n = doc.numPages; doc.destroy(); return n;
}

function openSheets(t) {

  ov.innerHTML = `<div class="bar"><button class="btn ghost" data-a="close">← 닫기</button><div class="t">${esc(t.title)}</div></div>
    <div class="body"><div class="shwrap">
      <div class="shpages">${t.sheets.map((s, i) => `<figure class="shpage"><figcaption>${esc(s.name)}</figcaption><div class="shimg"><img src="${encodeURI(s.src)}" alt="${esc(s.name)}">
        ${t.regions.filter(r => r.sheet === i).map(r => `<button class="hit ${r.lab === 'b' ? 'lb' : ''}" data-r="${r.id}" style="left:${r.rect[0] * 100}%;top:${r.rect[1] * 100}%;width:${(r.rect[2] - r.rect[0]) * 100}%;height:${(r.rect[3] - r.rect[1]) * 100}%" title="${esc(r.label)}"><span>${esc(r.label)}</span></button>`).join('')}</div></figure>`).join('')}</div>
      ${t.board ? `<button class="btn primary shgo" data-a="board">칠판으로 가기 →</button>` : ''}
    </div></div>`;
  $('#ovRoot').appendChild(ov); document.body.style.overflow = 'hidden';
  const tipPos = r => r.at === 'r'
    ? `left:${(r.rect[2] + .17) * 100}%;top:${(r.rect[1] - .04) * 100}%`
    : r.end ? `right:${(1 - r.rect[2]) * 100}%;top:${(r.rect[3] + .045) * 100}%` : `left:${r.rect[0] * 100}%;top:${(r.rect[3] + .045) * 100}%`;
  const draw = () => {
    $$('.hit', ov).forEach(h => h.classList.toggle('on', h.dataset.r === sel));
    $$('.shtip', ov).forEach(x => x.remove());
    const r = t.regions.find(x => x.id === sel); if (!r) return;
    $$('.shimg', ov)[r.sheet].insertAdjacentHTML('beforeend', `<div class="shtip ${r.at}${r.end ? ' end' : ''}" style="${tipPos(r)}">${esc(r.head)}${r.items ? `<ul>${r.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`);
  };
  ov.addEventListener('click', e => {
    const rb = e.target.closest('[data-r]');
    if (rb) { sel = sel === rb.dataset.r ? null : rb.dataset.r; draw(); return; }
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'close') { ov.remove(); document.body.style.overflow = ''; return; }
    if (a === 'board') return openBoard(t);
    if (sel && !e.target.closest('.shtip')) { sel = null; draw(); }
  });
}

const TYPE_PAD_KEY = 'pad:types';   // 유형정리 메모장 (모든 유형이 함께 씀)

// 유형 보이는 순서 (이름에 이 말이 들어 있으면 그 자리, 없으면 맨 뒤)
const TYPE_ORDER = ['교직관', '교사역량', '미래교육', '수업', '생활지도', '학급운영', '학교폭력', '동료교사', '교권', '주제별'];
const typeRank = n => { const s = n.replace(/[\s·・,]/g, ''); const i = TYPE_ORDER.findIndex(k => s.includes(k)); return i < 0 ? 99 : i; };
/* =========================================================
   일정: 2026년 12월 ~ 2027년 1월 달력 (12월 첫 줄의 11/29·11/30도 씀)
   빈 칸을 누르면 일정 추가 · 일정을 누르면 고치기 · 끌어서 다른 날로 옮기기
   ========================================================= */
const CAL_MONTHS = [[2026, 12], [2027, 1]];
const CAL_MIN = '2026-11-29', CAL_MAX = '2027-01-31';   // 12월 달력 첫 줄의 11/29·11/30부터
const CAL_HOL = {'2026-12-25': '성탄절', '2027-01-01': '신정'};
const CAL_COLORS = [['g', '초록'], ['b', '파랑'], ['y', '노랑'], ['r', '빨강'], ['p', '보라']];
const ymd = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const todayStr = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
const evSort = (a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')) || a.title.localeCompare(b.title);
const mdStr = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
function calMonth(y, m, evs) {
  const first = new Date(y, m - 1, 1).getDay(), n = new Date(y, m, 0).getDate(), t = todayStr();
  let cells = '';
  // 앞뒤 빈 칸에는 지난달·다음 달 날짜를 연하게 (예: 12월 1일 화요일 앞 월요일 = 11월 30일)
  // 그중 일정 범위 안이고 다른 달력에 없는 날(11/29, 11/30)은 일정도 넣을 수 있음
  const prevN = new Date(y, m - 1, 0).getDate(), py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  const firstShown = ymd(CAL_MONTHS[0][0], CAL_MONTHS[0][1], 1);
  const days = [];
  for (let i = 0; i < first; i++) {
    const d = prevN - first + 1 + i, ds = ymd(py, pm, d);
    days.push(ds >= CAL_MIN && ds < firstShown ? {ds, d, w: i, oth: true} : {pad: d});
  }
  for (let d = 1; d <= n; d++) days.push({ds: ymd(y, m, d), d, w: (first + d - 1) % 7});
  for (const {ds, d, w, oth, pad} of days) {
    if (pad) { cells += `<div class="cday pad"><div class="dn"><b>${pad}</b></div></div>`; continue; }
    const hol = CAL_HOL[ds];
    const cls = ['cday', oth && 'oth', w === 0 && 'sun', w === 6 && 'sat', hol && 'hol', ds === t && 'today'].filter(Boolean).join(' ');
    const list = evs.filter(e => e.date === ds).sort(evSort);
    cells += `<div class="${cls}" data-d="${ds}"><div class="dn"><b>${d}</b>${hol ? `<i>${hol}</i>` : oth ? `<i>${pm}월</i>` : ''}</div>${list.map(e =>
      `<button class="ev" data-id="${e.id}" data-c="${e.color || 'g'}" title="${esc((e.time ? e.time + ' ' : '') + e.title)}">${e.time ? `<span class="tm">${e.time}</span>` : ''}${esc(e.title)}</button>`).join('')}</div>`;
  }
  const tail = (7 - (first + n) % 7) % 7;
  for (let i = 0; i < tail; i++) cells += `<div class="cday pad"><div class="dn"><b>${i + 1}</b></div></div>`;
  return `<section class="cal"><h2>${m}월 <small>${y}</small></h2>
    <div class="wk">${'일월화수목금토'.split('').map(x => `<div>${x}</div>`).join('')}</div>
    <div class="days">${cells}</div></section>`;
}
// 휴대폰에서는 달력 칸이 좁아 일정 이름이 잘리니, 달력 아래에 오늘부터의 일정을 목록으로 (넓은 화면에서는 CSS로 숨김)
function upcomingHtml(evs) {
  const t = todayStr(), list = evs.filter(e => e.date >= t).sort(evSort);
  const dday = d => { const n = Math.round((new Date(d + 'T00:00') - new Date(t + 'T00:00')) / 864e5); return n ? `D-${n}` : '오늘'; };
  const wd = d => '일월화수목금토'[new Date(d + 'T00:00').getDay()];
  return `<section class="uplist" aria-label="다가오는 일정"><h2>다가오는 일정</h2>${list.length ? list.map(e => `<button class="upi" data-id="${e.id}" data-c="${e.color || 'g'}">
      <span class="ud"><b>${mdStr(e.date)}</b><small>${wd(e.date)}요일</small></span>
      <span class="ut"><b>${esc(e.title)}</b>${e.time || e.memo ? `<small>${esc([e.time, e.memo].filter(Boolean).join(' · '))}</small>` : ''}</span>
      <span class="dd">${dday(e.date)}</span></button>`).join('') : '<p class="upnone">앞으로 남은 일정이 없어요.</p>'}</section>`;
}
function renderSched() {
  const evs = D.sched;
  app().innerHTML = `<div class="lhead"><h1 class="h1">일정</h1><button class="btn primary" id="addEv">＋ 일정 추가</button></div>
    <p class="calhint">날짜 칸을 누르면 그날에 일정을 넣어요. 일정을 누르면 고치거나 지울 수 있고, 끌어서 다른 날로 옮길 수 있어요.</p>
    <div class="calwrap">${CAL_MONTHS.map(([y, m]) => calMonth(y, m, evs)).join('')}</div>

// 일정 끌어 옮기기 (마우스·터치 모두): 조금 움직이면 끌기, 그냥 떼면 고치기
function calDrag(btn) {
  let st = null;
  btn.onpointerdown = e => {
    if (e.button) return;
    st = {x: e.clientX, y: e.clientY, drag: false, ghost: null, over: null};
    btn.setPointerCapture(e.pointerId);
  };
  btn.onpointermove = e => {
    if (!st) return;
    if (!st.drag && Math.hypot(e.clientX - st.x, e.clientY - st.y) < 8) return;
    if (!st.drag) {
      st.drag = true; btn.classList.add('drag');
      st.ghost = btn.cloneNode(true); st.ghost.classList.remove('drag'); st.ghost.classList.add('evghost'); document.body.appendChild(st.ghost);
    }
    st.ghost.style.left = e.clientX + 'px'; st.ghost.style.top = e.clientY + 'px';
    const cell = document.elementFromPoint(e.clientX, e.clientY)?.closest('.cday[data-d]');
    if (cell !== st.over) { st.over?.classList.remove('over'); st.over = cell; cell?.classList.add('over'); }
    // 화면 끝에 가까우면 저절로 스크롤
    if (e.clientY > innerHeight - 50) scrollBy(0, 14); else if (e.clientY < 90) scrollBy(0, -14);
  };
  const end = ok => {
    if (!st) return;
    const s = st; st = null;
    s.ghost?.remove(); s.over?.classList.remove('over'); btn.classList.remove('drag');
    if (!ok) return;
    const all = D.sched, ev = all.find(x => x.id === btn.dataset.id); if (!ev) return;
    if (!s.drag) return editEv(ev);
    if (s.over && s.over.dataset.d !== ev.date) {
      ev.date = s.over.dataset.d; D.sched = all;
      const y = scrollY; renderSched(); scrollTo(0, y);
      toast(`${mdStr(ev.date)}로 옮겼어요`);
    }
  };
  btn.onpointerup = () => end(true);
  btn.onpointercancel = () => end(false);
  btn.onclick = e => e.stopPropagation();
  btn.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const ev = D.sched.find(x => x.id === btn.dataset.id); ev && editEv(ev); } };
}

// 답변 방향의 형광펜: 글 속 ==이렇게== 표시한 곳을 노랗게 칠함
// ■로 시작하는 줄은 소제목: 한 단계 크고 굵게
// 줄 단위로 그려서, 형광펜을 칠해도 ■ 줄의 글씨 모양·크기가 그대로 유지되게 함
const hlHtml = s => {
  let open = false, k = -1;   // k: 몇 번째 형광펜인지 (눌러서 지울 때 씀)
  return String(s || '').split('\n').map(line => {
    const parts = line.split('==');
    let h = open ? `<mark data-k="${k}">` : '';
    parts.forEach((p, i) => { if (i) { open = !open; if (open) k++; h += open ? `<mark data-k="${k}">` : '</mark>'; } h += esc(p); });
    if (open) h += '</mark>';
    h = h.replace(/<mark data-k="\d+"><\/mark>/g, '');
    return line.replace(/==/g, '').trimStart().startsWith('■') ? `<span class="sq">${h}</span>` : h;
  }).join('\n');
};
// k번째 ==…== 표시만 빼기
const dropHl = (s, k) => String(s || '').split('==').reduce((out, p, i) => i === 0 ? p : out + (i === 2 * k + 1 || i === 2 * k + 2 ? '' : '==') + p, '');
const serDesc = el => {
  const walk = node => {
    let s = '';
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) s += n.nodeValue;
      else if (n.nodeName === 'BR') s += '\n';
      else if (n.nodeName === 'MARK') { const x = walk(n).replace(/==/g, ''); if (x) s += '==' + x + '=='; }
      else if (n.nodeType === 1) { if (/^(DIV|P)$/.test(n.nodeName) && s && !s.endsWith('\n')) s += '\n'; s += walk(n); }
    });
    return s;
  };

};

        for (let k; (k = cut.match(IQ.ord)) && k.index < 12;) cut = cut.slice(k.index + k[0].length);
      }
      const k = !m && s.match(IQ.key);   // "지원 방안으로는 ~" 처럼 방안을 이름 붙여 말한 문장
      g.items.push({s, ord: !!m && m.index < 50, cut: k && k.index < 30 ? s.slice(k.index + k[0].length) : cut, soft: IQ.soft.test(s0) || IQ.soft.test(s), key: !!k && k.index < 30});
    });
    groups.forEach((g, gi) => {
      const ords = g.items.filter(x => x.ord);
      // 문제를 다시 말하기 전 도입(상황 설명)은 방안으로 세지 않음
      if (!gi && groups.length > 1 && !ords.length && !g.items.some(x => x.key)) { g.points = []; return; }
      g.points = (ords.length >= 2 ? ords : g.items.filter(x => x.ord || x.soft || x.key).map(x => x.ord || x.key ? x : {...x, cut: x.s.replace(IQ.soft, '')})).map(x => iqShort(x.cut || x.s));
    });
    const all = u.body.map(b => cl(b.s)).filter(Boolean), first = all[0] || '', last = all[all.length - 1] || '';
    const gs = groups.filter(g => g.head || g.points.length);
    const t1 = u.t1 ?? u.body[u.body.length - 1].t;
    return {no: ui + 1, label: u.label, question, groups: gs, first: iqShort(first, 140), last: iqShort(last, 140),
      dur: u.t0 != null && t1 != null ? Math.max(0, t1 - u.t0) : 0, think: u.think != null && u.t0 != null ? Math.max(0, u.t0 - u.think) : 0};
  });
}
// 나눠 보기 자료 (기록의 qa에 저장되는 모양): [{label, question, dur, think, groups: [{head, points: [], fl}]}]
// fl: 방안을 못 찾아 첫 문장·끝 문장을 대신 보여 주는 묶음
function qaAuto(P) {
  return (analyzeInterview(P) || []).map(u => {
    const groups = u.groups.map(g => ({head: g.head, points: [...g.points]}));
    if (!groups.some(g => g.points.length)) groups.push({head: '', points: [u.first, u.last].filter((x, i, a) => x && a.indexOf(x) === i), fl: true});
    return {label: u.label, question: u.question, dur: u.dur, think: u.think, groups};
  });
}

    ${evBar}
    ${qa.map((u, i) => `<div class="iqitem">${(editing ? edit : view)(u, i)}</div>`).join('')}

</div>`;
}

/* ---------- 녹화 ---------- */
async function openRecorder(kind) {
  const ov = document.createElement('div'); ov.className = 'ov recv';
  ov.innerHTML = `<div class="bar"><button class="btn ghost" data-a="close">← 닫기</button><div class="t">${KIND[kind].name} 녹화</div></div>
    <div class="body"><video autoplay muted playsinline></video>
      <div class="clock"><span class="dot"></span><span id="rClock">0:00</span></div>
      <div class="rctl"><span></span><button class="recbtn" title="녹화 시작/정지"><i></i></button>
        <button class="camsw hidden" title="앞·뒤 카메라 바꾸기">🔄 카메라 전환</button></div>
      <div class="msg" id="rMsg">카메라를 켜는 중…</div></div>`;
  $('#ovRoot').appendChild(ov); document.body.style.overflow = 'hidden';
  let stream, mr, chunks = [], t0 = 0, tick, cams = [];
  const stopAll = () => { clearInterval(tick); stream?.getTracks().forEach(t => t.stop()); };
  const close = () => { if (mr?.state === 'recording' && !confirm('녹화 중이에요. 저장하지 않고 닫을까요?')) return; if (mr?.state === 'recording') { mr.onstop = null; mr.stop(); } stopAll(); ov.remove(); document.body.style.overflow = ''; };
  $('[data-a=close]', ov).onclick = close;
  // 카메라 켜기: 지난번에 쓴 카메라(이 기기에만 기억)로. 앞카메라는 거울처럼, 뒤카메라는 그대로 보여 줌
  const CAM_KEY = 'imycam';
  const useCam = async deviceId => {
    stream?.getTracks().forEach(t => t.stop());
    const video = {width: {ideal: 1280}, height: {ideal: 720}, ...(deviceId ? {deviceId: {exact: deviceId}} : {})};
    try { stream = await navigator.mediaDevices.getUserMedia({video, audio: true}); }
    catch (e) { if (!deviceId) throw e; stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1280}, height: {ideal: 720}}, audio: true}); }
    const tr = stream.getVideoTracks()[0], set = tr?.getSettings?.() || {};
    const rear = set.facingMode === 'environment' || /back|rear|environment|후면/i.test(tr?.label || '');
    $('video', ov).classList.toggle('rear', rear);
    $('video', ov).srcObject = stream;
    try { if (set.deviceId) localStorage.setItem(CAM_KEY, set.deviceId); } catch {}
    return set.deviceId;
  };
  try {
    let saved = ''; try { saved = localStorage.getItem(CAM_KEY) || ''; } catch {}
    await useCam(saved || undefined); $('#rMsg', ov).textContent = '';
    // 카메라가 둘 이상이면 전환 버튼 보이기 (권한을 받은 뒤라야 목록이 나옴)
    cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    $('.camsw', ov).classList.toggle('hidden', cams.length < 2);
  } catch (e) {
    $('#rMsg', ov).textContent = '카메라·마이크를 쓸 수 없어요. 브라우저 권한을 확인해 주세요.'; $('.recbtn', ov).disabled = true; return;
  }
  $('.camsw', ov).onclick = async () => {
    if (mr?.state === 'recording') return toast('녹화 중에는 카메라를 바꿀 수 없어요. 녹화를 멈춘 뒤 바꿔 주세요.');
    const btn = $('.camsw', ov); btn.disabled = true;
    try {
      const cur = stream?.getVideoTracks()[0]?.getSettings?.().deviceId, i = cams.findIndex(c => c.deviceId === cur);
      await useCam(cams[(i + 1) % cams.length].deviceId);
    } catch { toast('카메라를 바꾸지 못했어요.'); }
    btn.disabled = false;
  };
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => window.MediaRecorder?.isTypeSupported?.(m)) || '';
  $('.recbtn', ov).onclick = () => {
    if (mr?.state === 'recording') { mr.stop(); return; }
    chunks = []; mr = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: 1_500_000} : {});
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = async () => {
      const dur = (Date.now() - t0) / 1000;
      const blob = new Blob(chunks, {type: mr.mimeType || 'video/webm'});
      stopAll(); ov.remove(); document.body.style.overflow = '';
      // 찍은 영상은 바로 저장 → 기록은 지금 또는 나중에
      const r = await saveNewRec(kind, blob, dur);
      openEditor(kind, r);
    };
    mr.start(1000); t0 = Date.now(); ov.classList.add('on');
    tick = setInterval(() => $('#rClock', ov).textContent = fmt((Date.now() - t0) / 1000), 500);
  };
}
async function saveNewRec(kind, blob, dur) {
  const r = {id: uid(), at: Date.now(), dur, in: 0, out: dur, unit: '', good: '', fix: '', type: blob.type, folder: CUR_FOLDER};
  await blobPut('vid:' + r.id, blob);
  D.setRecs(kind, [...D.recs(kind), r]);
  return r;
}
// webm 녹화본은 길이가 Infinity로 나올 때가 있어 끝으로 이동시켜 알아냄
function realDuration(v) {
  return new Promise(res => {
    if (isFinite(v.duration) && v.duration > 0) return res(v.duration);
    const done = () => { if (isFinite(v.duration)) { v.removeEventListener('durationchange', done); v.currentTime = 0; res(v.duration); } };
    v.addEventListener('durationchange', done); v.currentTime = 1e9;
  });
}

// 시작 지점 한 장면을 작은 그림으로
function thumbAt(v, t) {
  return new Promise(res => {
    const go = () => {
      try {
        const c = document.createElement('canvas'), w = 400; c.width = w; c.height = Math.round(w * (v.videoHeight || 9) / (v.videoWidth || 16));
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .7));
      } catch { res(''); }
    };
    v.pause(); const tt = Math.min(t + 0.5, (v.duration || t + 1) - 0.1);
    if (Math.abs(v.currentTime - tt) < .05) return go();
    v.addEventListener('seeked', go, {once: true}); v.currentTime = tt;
  });
}

// 전부 옮기기 파일(.imy): 'IMYONG1' + 머리말 길이(12자리) + 머리말 JSON + 큰 파일들을 이어 붙임
async function exportAll() {
  toast('파일을 묶는 중…');
  const {file, miss} = await packAll(), d = new Date(), a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = `임용준비_전체_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.imy`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  toast(`내보냈어요 (${(file.size / 1048576).toFixed(0)}MB)${miss ? ` · 드라이브에만 있는 파일 ${miss}개는 빠졌어요` : ''}`);
}
async function packAll() {
  const keys = (await idbDo('readonly', st => st.getAllKeys())).map(String).filter(k => !k.startsWith('sync:'));
  const head = {format: 'imyong-all', version: 1, at: new Date().toISOString(), kv: gdLocalKV(), blobs: []}, parts = [];
  let off = 0, miss = 0;
  for (const k of keys) {
    const v = await rawGet(k); if (v === undefined) continue;
    const {kind, blob} = gdPack(v);
    head.blobs.push({k, kind, type: blob.type || '', off, size: blob.size}); parts.push(blob); off += blob.size;
  }
  // 드라이브에만 있고 이 컴퓨터에 안 받은 파일은 빠짐
  const base = await gdBase(); if (base) miss = Object.keys(base.blobs).filter(k => !keys.includes(k)).length;
  const h = new TextEncoder().encode(JSON.stringify(head));
  return {file: new Blob(['IMYONG1', String(h.length).padStart(12, '0'), h, ...parts], {type: 'application/octet-stream'}), miss};
}
async function importAll(f) {
  let head, at;
  try { const hl = parseInt(await f.slice(7, 19).text(), 10); head = JSON.parse(await f.slice(19, 19 + hl).text()); at = 19 + hl; }
  catch { return toast('전부 옮기기 파일을 읽지 못했어요.'); }
  if (head.format !== 'imyong-all') return toast('임용 준비 전부 옮기기 파일이 아니에요.');
  if (!confirm(`${dstr(Date.parse(head.at))}에 내보낸 파일이에요.\n기록과 파일 ${head.blobs.length}개를 이 브라우저에 넣을까요?\n같은 항목은 파일 내용으로 바뀌어요.`)) return;
  closeModal(); toast('불러오는 중…');
  try {
    for (const b of head.blobs) {
      const part = f.slice(at + b.off, at + b.off + b.size);
      await blobPut(b.k, b.kind === 'j' ? JSON.parse(await part.text()) : new Blob([part], {type: b.type}));
    }
    for (const [k, v] of Object.entries(head.kv || {})) localStorage.setItem(k, v);
  } catch (e) { return toast('불러오다 멈췄어요: ' + e.message); }
  gdSoon(); toast('불러왔어요'); route();
}
function download(obj, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj)], {type: 'application/json'}));

function exportMine() {

async function importAny(f) {

  if (j.format === 'imyong-content') {

    const merge = (a, b) => { const m = new Map(a.map(x => [x.id, x])); (b || []).forEach(x => m.set(x.id, x)); return [...m.values()]; };
    D.templates = merge(D.templates, j.templates); D.docs = merge(D.docs, j.docs); D.types = merge(D.types, j.types);

    t.desc = d; D.types = all;
  }
  lsSet('typesSeed:iv01:v2', true);
}
// 이미 넣어 둔 '미래교육 · AI · 디지털'은 답변 방향 전체를 새 글로
if (!lsGet('typesSeed:iv02:v2', false)) {
  const all = D.types, t = all.find(x => x.id === 'seed-iv-02');
  if (t) { t.desc = IV02_DESC; D.types = all; }
  lsSet('typesSeed:iv02:v2', true);
}
// 이미 넣어 둔 '주제별 교육'도 답변 방향 전체를 고정된 새 글로
if (!lsGet('typesSeed:iv03:v2', false)) {
  const all = D.types, t = all.find(x => x.id === 'seed-iv-03');
  if (t) { t.desc = IV03_DESC; D.types = all; }
  lsSet('typesSeed:iv03:v2', true);
}
// 이미 넣어 둔 '수업 · 평가 · 학습 지원'도 새 글로
if (!lsGet('typesSeed:iv04:v2', false)) {
  const all = D.types, t = all.find(x => x.id === 'seed-iv-04');
  if (t) { t.desc = IV04_DESC; D.types = all; }
  lsSet('typesSeed:iv04:v2', true);
}
// 이미 넣어 둔 '학급 운영'도 새 글로
if (!lsGet('typesSeed:iv05:v2', false)) {

  lsSet('typesSeed:iv05:v2', true);
}
// 이미 넣어 둔 '생활지도 · 상담'도 새 글로
if (!lsGet('typesSeed:iv06:v2', false)) {
  const all = D.types, t = all.find(x => x.id === 'seed-iv-06');

}
// 이미 넣어 둔 '학교폭력 · 사이버폭력'도 새 글로
if (!lsGet('typesSeed:iv07:v2', false)) {
  const all = D.types, t = all.find(x => x.id === 'seed-iv-07');
  if (t) { t.desc = IV07_DESC; D.types = all; }
  lsSet('typesSeed:iv07:v2', true);
}
// '다문화 · 통합 학급'을 '주제별 교육'에 합침: 글·질문·지난 답변을 옮기고 따로 있던 유형은 지움
if (!lsGet('typesSeed:iv03:v3', false)) {
  let all = D.types;
  const t = all.find(x => x.id === 'seed-iv-03');
  if (t) {
    if (!(t.desc || '').includes('■ 다문화 학생')) t.desc = ((t.desc || '').replace(/\s+$/, '') + '\n\n' + IV03_MULTI).trimStart();
    t.questions = [...new Set([...(t.questions || []), ...IV03_MULTI_QS])];
    if (t.name === '주제별 교육 (민주시민·생태전환·인성·독서)') t.name = IV03_NAME;
    const old = D.ans('seed-iv-08');
    if (old.length) D.setAns('seed-iv-03', [...D.ans('seed-iv-03'), ...old]);
    all = all.filter(x => x.id !== 'seed-iv-08');
    D.types = all;
    localStorage.removeItem('imy:ans:seed-iv-08');
  }
  lsSet('typesSeed:iv03:v3', true);
}
// '학부모 소통' 유형은 없앰 (써 둔 답변 기록은 지우지 않고 남겨 둠)
if (!lsGet('typesSeed:iv09:removed', false)) {
  D.types = D.types.filter(x => x.id !== 'seed-iv-09');
  lsSet('typesSeed:iv09:removed', true);
}
// 이미 넣어 둔 '동료교사 · 교사공동체'도 새 글로
if (!lsGet('typesSeed:iv10:v2', false)) {
  const all = D.types, t = all.find(x => x.id === 'seed-iv-10');
  if (t) { t.desc = IV10_DESC; D.types = all; }
  lsSet('typesSeed:iv10:v2', true);
}
// 이미 넣어 둔 '교권 · 교사 소진'도 새 글로
if (!lsGet('typesSeed:iv11:v2', false)) {
  const all = D.types, t = all.find(x => x.id === 'seed-iv-11');
  if (t) { t.desc = IV11_DESC; D.types = all; }
  lsSet('typesSeed:iv11:v2', true);
}

// 맞춤법 고침: 이미 넣어 둔 유형정리 글에도 한 번 적용 (2026-11-19)
if (!lsGet('typesSeed:typo:v1', false)) {
  const FIX = [
  ['(실제로 학생들 로그인 하는데만 10분 걸린다.)', '(실제로 학생들이 로그인하는 데만 10분 걸린다.)'],
  ['에듀테크를 조작하는데에 집중하여 학습목표를', '에듀테크를 조작하는 데에 집중하여 학습 목표를'],
  ['채움AI: AI활용해 서·논술형', '채움AI: AI를 활용해 서·논술형'],
  ['유휴 공간을 공간혁신으로 독서 공간으로 →', '유휴 공간을 공간 혁신으로 독서 공간으로 바꾸기 →'],
  ['학생들간 다툼이 있을 시 화해하는 자리를 마련', '학생들 간 다툼이 있을 때 화해하는 자리를 마련'],
  ['방과후등 정해진 시간에 다양한 프로그램(예:케이크 만들기)을 진행 -> 자신의', '방과 후 등 정해진 시간에 다양한 프로그램(예: 케이크 만들기)을 진행 → 자신의']
  ];
  const all = D.types; let ch = false;
  all.forEach(t => FIX.forEach(([a, b]) => { if ((t.desc || '').includes(a)) { t.desc = t.desc.split(a).join(b); ch = true; } }));
  if (ch) D.types = all;
  lsSet('typesSeed:typo:v1', true);
}
